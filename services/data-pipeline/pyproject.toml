[project]
name = "immojudis-data-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "schema_contract: colonnes écrites par le pipeline contre le schéma migré (SCHEMA_CONTRACT_DB_URL, job « Supabase migrations + pgTAP »)",
    "llm_display_disabled: synthèse rédigée coupée (LLM_DISPLAY_ENABLED=false, réglage de production)",
]
# Le contrat de schéma ne tourne que dans le job de migrations : `pytest -m schema_contract` l'y sélectionne.
addopts = "-m 'not schema_contract'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]
ignore = ["E501"]

# Le paquet « fitz » est l'ancien nom de PyMuPDF : son import affiche un avertissement de dépréciation.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fitz".msg = "Utiliser « import pymupdf » (« fitz » est déprécié)."
