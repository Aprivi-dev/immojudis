[project]
name = "immojudis-data-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]
ignore = ["E501"]

# Le paquet « fitz » est l'ancien nom de PyMuPDF : son import affiche un avertissement de dépréciation.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fitz".msg = "Utiliser « import pymupdf » (« fitz » est déprécié)."
