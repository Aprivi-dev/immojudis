                        - Prévision statistique fondée sur des ventes passées comparables; elle ne garantit aucun résultat.
                      refusalReason: null
              schema:
                type: object
                required: [forecast]
                properties:
                  forecast:
                    $ref: "#/components/schemas/OutcomeGraphForecast"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /tribunals/judicial-activity:
    get:
      operationId: getTribunalJudicialActivity
      summary: Lire l'activité des ventes judiciaires suivies pour un tribunal
      description: >-
        Réservé au plan Analyse : jeton Bearer obligatoire (401 sans jeton, 403
        sans l'offre Analyse). Agrégat limité aux annonces explicitement judiciaires, confirmées
        ou recoupées, et rattachées par code exact à un tribunal actif du
        référentiel Justice. Les ventes notariales, les annonces en attente ou en
        conflit, les dates aberrantes et les rattachements approximatifs sont
        exclus. Les médianes sont masquées sous cinq observations. Cet agrégat
        mesure la couverture Immojudis et ne prétend pas être un registre exhaustif
        de l'activité du greffe. Répond 404 quand `saleId` ne désigne aucune
        annonce visible et 422 `COURT_UNRESOLVED` quand le rattachement exact au
        tribunal reste à confirmer.
      security:
        - bearerAuth: []
      parameters:
        - name: courtCode
          in: query
          required: false
          description: >-
            Code exact d'un tribunal actif, normalisé en minuscules. Fournir
            exactement ce paramètre ou `saleId`.
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: "^[a-z0-9][a-z0-9:._-]*$"
        - name: saleId
          in: query
          required: false
          description: >-
            Identifiant d'une annonce dont le tribunal judiciaire vérifié sera
            résolu côté serveur. Fournir exactement ce paramètre ou `courtCode`.
          schema:
            type: string
            format: uuid
        - name: historyMonths
          in: query
          required: false
          description: >-
            Fenêtre des ventes passées observées, en mois; 36 par défaut. La valeur
            3 donne la fenêtre glissante la plus courte.
          schema:
            type: integer
            enum: [3, 12, 24, 36]
            default: 36
      responses:
        "200":
          description: Activité judiciaire agrégée et provenance du calcul.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
