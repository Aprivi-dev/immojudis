        contrôlée dans la fenêtre. Chaque niveau conserve ses échantillons, ses
        fourchettes centrales de mise à prix et d'anticipation, ainsi que ses
        limites de couverture. Aucune ligne d'annonce ou preuve source n'est renvoyée.
      security:
        - bearerAuth: []
      parameters:
