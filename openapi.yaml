    TribunalStatisticsAdjustmentMethod:
      type: string
      enum:
        - suppressed
        - raw
        - beta_binomial
        - national_fallback
        - log_shrinkage
      description: >-
        `national_fallback` est réservé pour compatibilité. Le builder v1
        supprime la cellule lorsqu'une référence nationale publiable manque; il
        n'émet pas un repli national de substitution dans ce cas.
    TribunalStatisticsPublicSampleCount:
      oneOf:
        - type: integer
          minimum: 10
        - type: "null"
      description: >-
        Compte public. Il vaut null sous 10 ou lorsque le quality gate échoue;
        le compte exact reste privé.
    TribunalStatisticsConfidenceInterval:
      type: object
      additionalProperties: false
      required: [low, high]
      properties:
        low:
          type: number
          minimum: 0
          maximum: 1
        high:
          type: number
          minimum: 0
          maximum: 1
      description: Intervalle ordonné avec `low ≤ high`.
    TribunalStatisticsPublishedMetric:
      type: object
      additionalProperties: false
      required:
        - rawValue
        - adjustedValue
        - numerator
        - knownDenominator
        - eligibleUniverse
        - unknownCount
        - excludedCount
        - exclusionReasons
        - confidenceInterval
        - method
      properties:
        rawValue:
          type: number
          minimum: 0
          maximum: 1
        adjustedValue:
          type: number
          minimum: 0
          maximum: 1
        numerator:
          type: integer
          minimum: 0
        knownDenominator:
          type: integer
          minimum: 10
        eligibleUniverse:
          type: integer
          minimum: 10
        unknownCount:
          type: integer
          minimum: 0
          description: Inconnus conservés hors du dénominateur connu.
        excludedCount:
          type: integer
          minimum: 0
        exclusionReasons:
          type: object
          propertyNames:
            enum:
              - no_terminal_outcome_at_cutoff
              - ambiguous_terminal_outcome
              - outcome_status_claim_ineligible
              - unsupported_outcome_status
              - surenchere_status_claim_ineligible
              - initial_starting_price_eur_claim_ineligible
              - effective_starting_price_eur_claim_ineligible
              - final_hammer_price_claim_ineligible
              - finality_status_claim_ineligible
              - non_positive_price
              - result_observed_at_claim_ineligible
              - result_observed_after_cutoff
              - result_observed_before_hearing
          additionalProperties:
            type: integer
            minimum: 0
        confidenceInterval:
          $ref: "#/components/schemas/TribunalStatisticsConfidenceInterval"
        method:
          type: string
          enum: [raw, beta_binomial, national_fallback]
          description: >-
            `national_fallback` est réservé pour compatibilité; le builder v1
            supprime la cellule si son parent publiable manque.
      description: >-
        Proportion publiée avec dénominateur propre. Le numérateur ne dépasse
        pas le dénominateur connu et knownDenominator + unknownCount +
        excludedCount = eligibleUniverse. Au national, les proportions de 10 à
        29 observations utilisent l'a priori de Jeffreys versionné.
    TribunalStatisticsSuppressedMetric:
      type: object
      additionalProperties: false
      required:
        - rawValue
        - adjustedValue
        - numerator
        - knownDenominator
        - eligibleUniverse
        - unknownCount
        - excludedCount
        - exclusionReasons
        - confidenceInterval
        - method
      properties:
        rawValue:
          type: "null"
        adjustedValue:
          type: "null"
        numerator:
          type: "null"
        knownDenominator:
          type: "null"
        eligibleUniverse:
          type: "null"
        unknownCount:
          type: "null"
        excludedCount:
          type: "null"
        exclusionReasons:
          type: object
          additionalProperties: false
          maxProperties: 0
        confidenceInterval:
          type: "null"
        method:
          type: string
          const: suppressed
      description: >-
        Cellule entièrement masquée. Aucun compte exact ni motif chiffré n'est
        exposé afin d'empêcher sa reconstruction.
    TribunalStatisticsMetric:
      oneOf:
        - $ref: "#/components/schemas/TribunalStatisticsPublishedMetric"
        - $ref: "#/components/schemas/TribunalStatisticsSuppressedMetric"
      description: >-
        Proportion publiée ou cellule entièrement masquée sous 10 observations
        ou lorsque le quality gate du snapshot échoue.
    TribunalStatisticsQuantiles:
      type: object
      additionalProperties: false
      required: [p10, p50, p90]
      properties:
        p10:
          type: number
          minimum: 0
        p50:
          type: number
          minimum: 0
        p90:
          type: number
          minimum: 0
      description: Quantiles monotones `p10 ≤ p50 ≤ p90`.
    TribunalStatisticsPublishedDistribution:
      type: object
      additionalProperties: false
      required:
        - sampleSize
        - eligibleUniverse
        - unknownCount
        - raw
        - adjusted
        - method
        - parentSampleSize
        - excludedCount
        - exclusionReasons
      properties:
        sampleSize:
          type: integer
          minimum: 10
        eligibleUniverse:
          type: integer
          minimum: 10
        unknownCount:
          type: integer
          minimum: 0
          description: Observations inconnues conservées hors de l'échantillon connu.
        raw:
          $ref: "#/components/schemas/TribunalStatisticsQuantiles"
        adjusted:
          $ref: "#/components/schemas/TribunalStatisticsQuantiles"
        method:
          type: string
          enum: [raw, national_fallback, log_shrinkage]
          description: >-
            `national_fallback` est réservé pour compatibilité; le builder v1
            supprime la cellule si son parent publiable manque.
        parentSampleSize:
          type: integer
          minimum: 0
        excludedCount:
          type: integer
          minimum: 0
        exclusionReasons:
          type: object
          propertyNames:
            enum:
              - no_terminal_outcome_at_cutoff
              - ambiguous_terminal_outcome
              - outcome_status_claim_ineligible
              - unsupported_outcome_status
              - surenchere_status_claim_ineligible
              - initial_starting_price_eur_claim_ineligible
              - effective_starting_price_eur_claim_ineligible
              - final_hammer_price_claim_ineligible
              - finality_status_claim_ineligible
              - non_positive_price
              - result_observed_at_claim_ineligible
              - result_observed_after_cutoff
              - result_observed_before_hearing
          additionalProperties:
            type: integer
            minimum: 0
      description: >-
        Distribution publiée de ratio ou de délai, avec sampleSize +
        unknownCount + excludedCount = eligibleUniverse. Une distribution locale
        exige une référence nationale publiable.
    TribunalStatisticsSuppressedDistribution:
      type: object
      additionalProperties: false
      required:
        - sampleSize
        - eligibleUniverse
        - unknownCount
        - raw
        - adjusted
        - method
        - parentSampleSize
        - excludedCount
        - exclusionReasons
      properties:
        sampleSize:
          type: "null"
        eligibleUniverse:
          type: "null"
        unknownCount:
          type: "null"
        raw:
          type: "null"
        adjusted:
          type: "null"
        method:
          type: string
          const: suppressed
        parentSampleSize:
          type: "null"
        excludedCount:
          type: "null"
        exclusionReasons:
          type: object
          additionalProperties: false
          maxProperties: 0
      description: >-
        Distribution entièrement masquée. Aucun effectif, quantile, parent ni
        motif chiffré n'est exposé.
    TribunalStatisticsDistribution:
      oneOf:
        - $ref: "#/components/schemas/TribunalStatisticsPublishedDistribution"
        - $ref: "#/components/schemas/TribunalStatisticsSuppressedDistribution"
      description: >-
        Distribution publiée ou entièrement masquée. Au national, 10 à 29
        observations restent supprimées faute de parent indépendant. En local,
        une référence nationale publiable est obligatoire.
    TribunalStatisticsFlow:
      type: object
      additionalProperties: false
      required:
        - held
        - postponed
        - cancelled
        - notRequested
        - noBidIfHeld
        - adjudicatedIfHeld
      properties:
        held:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
        postponed:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
        cancelled:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
        notRequested:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
        noBidIfHeld:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
        adjudicatedIfHeld:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
    TribunalStatisticsSurenchere:
      type: object
      additionalProperties: false
      required: [filed]
      properties:
        filed:
          $ref: "#/components/schemas/TribunalStatisticsMetric"
    TribunalStatisticsPriceRatios:
      type: object
      additionalProperties: false
      required: [finalToInitial, finalToEffective, finalToMarket]
      properties:
        finalToInitial:
          $ref: "#/components/schemas/TribunalStatisticsDistribution"
          description: >-
            Prix final / mise initiale. Exige un final_hammer_price_eur et une
            finality_status procedurally_definitive admissibles; le prix
            d'adjudication initial n'est jamais substitué au prix final.
        finalToEffective:
          $ref: "#/components/schemas/TribunalStatisticsDistribution"
          description: >-
            Prix final / mise effective, avec les mêmes exigences de prix final
            et de finalité procédurale.
        finalToMarket:
          $ref: "#/components/schemas/TribunalStatisticsDistribution"
          description: >-
            Toujours suppressed dans tribunal_statistics_builder_v1 faute
            d'estimation de marché pré-audience canonique. Tous les comptes et
            quantiles publics sont null.
    TribunalStatisticsDelays:
      type: object
      additionalProperties: false
      required: [hearingToKnownResult, postponementToNextHearing]
      properties:
        hearingToKnownResult:
          $ref: "#/components/schemas/TribunalStatisticsDistribution"
        postponementToNextHearing:
          $ref: "#/components/schemas/TribunalStatisticsDistribution"
          description: >-
            Toujours suppressed dans tribunal_statistics_builder_v1 faute de
            lien canonique vérifié vers l'audience suivante. Tous les comptes et
            quantiles publics sont null.
    TribunalStatisticsFallback:
      type: object
      additionalProperties: false
      required: [scope, parentLabel, localWeight]
      properties:
        scope:
          type: string
          enum: [none, national]
        parentLabel:
          type: [string, "null"]
          minLength: 1
        localWeight:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Signal global de qualité fondé sur l'échantillon de statuts, affiché
            comme « Qualité globale ». Ce n'est ni un poids par cellule, ni la
            force d'un a priori bêta-binomial, ni le coefficient exact du
            rétrécissement.
    TribunalStatisticsItem:
      type: object
      additionalProperties: false
      required:
        - scope
        - tribunal
        - roundKind
        - period
        - reliability
        - samples
        - flow
        - surenchere
        - priceRatios
        - delays
        - fallback
        - methodology
        - limitations
      properties:
        scope:
          type: string
          enum: [national, tribunal]
        tribunal:
          oneOf:
            - type: object
              additionalProperties: false
              required: [code, name, judicialRegion]
              properties:
                code:
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                judicialRegion:
                  type: [string, "null"]
                  minLength: 1
            - type: "null"
          description: Null pour le scope national, obligatoire pour le scope tribunal.
        roundKind:
          type: string
          const: initial
        period:
          type: object
          additionalProperties: false
          required: [start, end, windowMonths, knowledgeCutoffAt]
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
            windowMonths:
              type: integer
              enum: [12, 24, 36]
            knowledgeCutoffAt:
              type: string
              format: date-time
        reliability:
          type: object
          additionalProperties: false
          required: [level, label, qualityGatePassed, coverage, warnings]
          properties:
            level:
              type: string
              enum: [insufficient_data, smoothed, descriptive, robust]
              description: >-
                Signal global du snapshot fondé sur l'échantillon de statuts, le
                quality gate et la couverture. robust exige au moins 100 statuts
                connus, un quality gate réussi et une couverture d'au moins 80 %.
                Avec au moins 100 statuts mais une couverture inférieure, le
                niveau reste descriptive et un avertissement est fourni. Il ne
                qualifie pas chaque cellule et ne constitue pas une fiabilité
                prédictive.
            label:
              type: string
              minLength: 1
            qualityGatePassed:
              type: boolean
              description: >-
                Vrai seulement si la revue humaine et la couverture privée du gel
                antérieur au cutoff (au moins 80 %) satisfont les règles v1. Si
                false, toutes les métriques et distributions du snapshot sont
                supprimées, indépendamment de leur taille d'échantillon.
            coverage:
              oneOf:
                - type: number
                  minimum: 0
                  maximum: 1
                - type: "null"
              description: >-
                Statuts admissibles connus divisés par eligibleRounds dans le
                sous-univers disposant d'un snapshot de features gelé. Vaut null
                si eligibleRounds ou status est masqué; ne mesure pas toutes les
                audiences initiales matures.
            warnings:
              type: array
              description: >-
                Avertissements agrégés non personnels. Peut notamment contenir
                `round_not_frozen_at_cutoff` pour signaler, sans effectif public,
                des audiences matures exclues faute de snapshot gelé admissible.
              items:
                type: string
                minLength: 1
        samples:
          type: object
          additionalProperties: false
          required:
            - eligibleRounds
            - status
            - initialPrice
            - effectivePrice
            - marketPrice
            - surenchere
            - resultDelay
            - postponementDelay
            - doubleReviewed
          properties:
            eligibleRounds:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
              description: >-
                Audiences initiales matures disposant d'un snapshot de features
                gelé admissible au cutoff; ce n'est pas l'ensemble des audiences
                matures.
            status:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
            initialPrice:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
            effectivePrice:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
            marketPrice:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
              description: >-
                Null dans tribunal_statistics_builder_v1, car finalToMarket est
                toujours supprimé.
            surenchere:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
            resultDelay:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
            postponementDelay:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
              description: >-
                Null dans tribunal_statistics_builder_v1, car
                postponementToNextHearing est toujours supprimé.
            doubleReviewed:
              $ref: "#/components/schemas/TribunalStatisticsPublicSampleCount"
          description: >-
            Effectifs publics indépendamment masqués sous 10 ou lorsque le
            quality gate échoue. Les effectifs exacts restent dans le snapshot et
            le manifeste privés.
        flow:
          $ref: "#/components/schemas/TribunalStatisticsFlow"
        surenchere:
          $ref: "#/components/schemas/TribunalStatisticsSurenchere"
        priceRatios:
          $ref: "#/components/schemas/TribunalStatisticsPriceRatios"
        delays:
          $ref: "#/components/schemas/TribunalStatisticsDelays"
        fallback:
          $ref: "#/components/schemas/TribunalStatisticsFallback"
        methodology:
          type: object
          additionalProperties: false
          required: [builderVersion, eligibilityRuleVersion, smoothingRuleVersion]
          properties:
            builderVersion:
              type: string
              const: tribunal_statistics_builder_v1
            eligibilityRuleVersion:
              type: string
              const: claim_ab_reviewed_frozen_round_as_of_v1
            smoothingRuleVersion:
              type: string
              const: jeffreys_beta_log_shrinkage_v1
        limitations:
          type: array
          items:
            type: string
            minLength: 1
    TribunalStatisticsResponse:
      type: object
      additionalProperties: false
      required: [national, tribunals, meta]
      properties:
        national:
          $ref: "#/components/schemas/TribunalStatisticsItem"
        tribunals:
          type: array
          items:
            $ref: "#/components/schemas/TribunalStatisticsItem"
        meta:
          type: object
          additionalProperties: false
          required: [generatedAt, experimental, windowMonths, roundKind, warnings]
          properties:
            generatedAt:
              type: string
              format: date-time
            experimental:
              type: boolean
              const: true
            windowMonths:
              type: integer
              enum: [12, 24, 36]
            roundKind:
              type: string
              const: initial
            warnings:
              type: array
              description: >-
                Avertissements nationaux agrégés, dont éventuellement
                `round_not_frozen_at_cutoff`. L'effectif exact reste privé.
              items:
                type: string
                minLength: 1
    AdjudicationQuartileRange:
      type: object
      required: [p25, p75]
      properties:
        p25:
          type: number
          exclusiveMinimum: 0
        p75:
          type: number
          exclusiveMinimum: 0
      description: Quartiles inférieur et supérieur (P25 ≤ P75).
    AdjudicationBidBand:
      type: object
      required: [band, count, share]
      properties:
        band:
          type: string
          enum:
            - below_starting
            - at_starting
            - above_1_below_1_5
            - from_1_5_below_2
            - from_2_below_3
            - at_least_2
            - at_least_3
          description: >-
            Tranche du rapport prix final / mise à prix. La répartition en cinq tranches
            (`bidDistribution`) utilise `at_least_2`; la répartition détaillée en six tranches
            (`detailedBidDistribution`) la scinde en `from_2_below_3` et `at_least_3`.
        count:
          type: integer
          minimum: 0
        share:
          type: number
          minimum: 0
          maximum: 1
    AdjudicationDistribution:
      type: object
      required: [sampleSize, hammerPriceMiddle50Eur, ratioMiddle50, bidDistribution]
      description: >-
        Répartition des adjudications d'un échantillon d'au moins dix ventes. Les comptes de
        `bidDistribution` somment à `sampleSize`.
      properties:
        sampleSize:
          type: integer
          minimum: 10
        hammerPriceMiddle50Eur:
          $ref: "#/components/schemas/AdjudicationQuartileRange"
        ratioMiddle50:
          $ref: "#/components/schemas/AdjudicationQuartileRange"
        summary:
          type: object
          required:
            - medianHammerPriceEur
            - medianStartingPriceEur
            - medianHammerToStartingRatio
            - meanHammerToStartingRatio
          properties:
            medianHammerPriceEur:
              type: number
              exclusiveMinimum: 0
            medianStartingPriceEur:
              type: number
              exclusiveMinimum: 0
            medianHammerToStartingRatio:
              type: number
              exclusiveMinimum: 0
            meanHammerToStartingRatio:
              type: number
              exclusiveMinimum: 0
        detailedBidDistribution:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/AdjudicationBidBand"
        bidDistribution:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/AdjudicationBidBand"
    AdjudicationPriceStatisticsScope:
      type: object
      required:
        - scopeType
        - label
        - courtCode
        - judicialRegion
        - periodStart
        - periodEnd
        - sampleSize
        - reliability
        - metrics
      description: >-
        Statistiques d'un périmètre (national ou d'un tribunal), sur les adjudications publiées par
        Licitor. Expérimentales et descriptives : elles ne prédisent pas le prix d'une vente.
      properties:
        scopeType:
          type: string
          enum: [national, tribunal]
        label:
          type: string
          minLength: 1
        courtCode:
          type: [string, "null"]
          minLength: 1
        judicialRegion:
          type: [string, "null"]
          minLength: 1
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        sampleSize:
          type: integer
          minimum: 10
        reliability:
          type: string
          enum: [limited, descriptive, extended]
        distribution:
          oneOf:
            - $ref: "#/components/schemas/AdjudicationDistribution"
            - type: "null"
        propertyTypes:
          type: array
          maxItems: 7
          items:
            type: object
            required: [propertyType, distribution]
            properties:
              propertyType:
                type: string
                enum: [apartment, house, commercial, building, land, parking, mixed]
              distribution:
                $ref: "#/components/schemas/AdjudicationDistribution"
        metrics:
          type: object
          required:
            - medianHammerToStartingRatio
            - aboveStartingRate
            - atLeastDoubleRate
            - medianHammerPriceEur
            - medianStartingPriceEur
          properties:
            medianHammerToStartingRatio:
              type: number
              exclusiveMinimum: 0
            aboveStartingRate:
              type: number
              minimum: 0
              maximum: 1
            atLeastDoubleRate:
              type: number
              minimum: 0
              maximum: 1
            medianHammerPriceEur:
              type: number
              exclusiveMinimum: 0
            medianStartingPriceEur:
              type: number
              exclusiveMinimum: 0
    AdjudicationPriceStatisticsMeta:
      type: object
      required:
