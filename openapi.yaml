              type: string
              const: source_publication_date_or_first_seen_at
            deduplication:
              type: string
              const: canonical_id_source_url_strong_address
            rawAnnouncements:
              type: integer
              minimum: 0
            deduplicatedAnnouncements:
              type: integer
              minimum: 0
            unresolvedStrongAddressDuplicates:
              type: integer
              minimum: 0
            archivedAnnouncements:
              type: integer
              minimum: 0
              description: Ventes passées lues dans l'archive quand leur annonce a quitté le catalogue.
            outcomeGateApplied:
              type: boolean
              const: false
            limitations:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
    TribunalListingStatisticsMetric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, value, sampleSize, interval]
          properties:
            status:
              type: string
              const: published
            value:
              type: number
              minimum: 0
            sampleSize:
              type: integer
              minimum: 0
            interval:
              description: Intervalle de Wilson à 95 % quand la mesure est une part, sinon null.
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [low, high]
                  properties:
                    low:
                      type: number
                      minimum: 0
                      maximum: 1
                    high:
                      type: number
                      minimum: 0
                      maximum: 1
        - type: object
          additionalProperties: false
          required: [status, value, min, max, sampleSize]
          properties:
            status:
              type: string
              const: range_only
            value:
              type: "null"
            min:
              type: number
              minimum: 0
            max:
              type: number
              minimum: 0
            sampleSize:
              type: integer
              minimum: 0
        - type: object
          additionalProperties: false
          required: [status, value, sampleSize]
          properties:
            status:
              type: string
              const: insufficient_data
            value:
              type: "null"
            sampleSize:
              type: integer
              minimum: 0
    TribunalJudicialActivityMetric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, value, sampleSize]
          properties:
            status:
              type: string
              const: published
            value:
              type: number
              minimum: 0
            sampleSize:
              type: integer
              minimum: 3
        - type: object
          additionalProperties: false
          required: [status, value, sampleSize]
          properties:
            status:
              type: string
              const: insufficient_data
            value:
              type: "null"
            sampleSize:
              type: integer
              minimum: 0
      description: >-
        Médiane ou taux accompagné de son échantillon. Le seuil usuel est cinq;
        la médiane des lots par jour d'audience utilise trois jours distincts.
    TribunalJudicialActivityRangeMetric:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status, p25, p50, p75, sampleSize]
          properties:
            status:
              type: string
              const: published
            p25:
              type: number
              minimum: 0
            p50:
              type: number
              minimum: 0
            p75:
              type: number
              minimum: 0
            sampleSize:
              type: integer
              minimum: 5
        - type: object
          additionalProperties: false
          required: [status, p25, p50, p75, sampleSize]
          properties:
            status:
              type: string
              const: insufficient_data
            p25:
              type: "null"
            p50:
              type: "null"
            p75:
              type: "null"
            sampleSize:
              type: integer
              minimum: 0
      description: >-
        Fourchette interquartile avec médiane. Publiée à partir de cinq
        observations et ordonnée P25 ≤ P50 ≤ P75.
    TribunalJudicialActivityResponse:
      type: object
      additionalProperties: false
      required: [court, period, activity, reliability, provenance]
      properties:
        court:
          type: object
          additionalProperties: false
          required: [code, name, judicialRegion]
          properties:
            code:
              type: string
            name:
              type: string
            judicialRegion:
              type: [string, "null"]
        period:
          type: object
          additionalProperties: false
          required: [historyMonths, historyStart, asOf, upcomingEnd]
          properties:
            historyMonths:
              type: integer
              enum: [12, 24, 36]
            historyStart:
              type: string
              format: date-time
            asOf:
              type: string
              format: date-time
            upcomingEnd:
              type: string
              format: date-time
        activity:
          type: object
          additionalProperties: false
          required:
            - observedPastSales
            - upcomingSales
            - upcomingSales90Days
            - upcomingHearingDays
            - nextSaleAt
            - medianStartingPriceEur
            - startingPriceRangeEur
            - visitCoverage
            - medianDiscoveryLeadDays
            - discoveryLeadRangeDays
            - medianLotsPerHearingDay
            - medianDaysBetweenHearingDays
            - topPropertyTypes
            - propertyTypeBenchmarks
          properties:
            observedPastSales:
              type: integer
              minimum: 0
            upcomingSales:
              type: integer
              minimum: 0
            upcomingSales90Days:
              type: integer
              minimum: 0
            upcomingHearingDays:
              type: integer
              minimum: 0
            nextSaleAt:
              type: [string, "null"]
              format: date-time
            medianStartingPriceEur:
              $ref: "#/components/schemas/TribunalJudicialActivityMetric"
            startingPriceRangeEur:
              $ref: "#/components/schemas/TribunalJudicialActivityRangeMetric"
            visitCoverage:
              $ref: "#/components/schemas/TribunalJudicialActivityMetric"
            medianDiscoveryLeadDays:
              $ref: "#/components/schemas/TribunalJudicialActivityMetric"
            discoveryLeadRangeDays:
              $ref: "#/components/schemas/TribunalJudicialActivityRangeMetric"
            medianLotsPerHearingDay:
              $ref: "#/components/schemas/TribunalJudicialActivityMetric"
            medianDaysBetweenHearingDays:
              $ref: "#/components/schemas/TribunalJudicialActivityMetric"
            topPropertyTypes:
              type: array
              maxItems: 3
              items:
                type: object
                additionalProperties: false
                required: [propertyType, count, share]
                properties:
                  propertyType:
                    type: string
                  count:
                    type: integer
                    minimum: 1
                  share:
                    type: number
                    minimum: 0
                    maximum: 1
            propertyTypeBenchmarks:
              type: array
              maxItems: 12
              items:
                type: object
                additionalProperties: false
                required:
                  - propertyType
                  - observedSales
                  - startingPriceRangeEur
                  - discoveryLeadRangeDays
                properties:
                  propertyType:
                    type: string
                  observedSales:
                    type: integer
                    minimum: 1
                  startingPriceRangeEur:
                    $ref: "#/components/schemas/TribunalJudicialActivityRangeMetric"
                  discoveryLeadRangeDays:
                    $ref: "#/components/schemas/TribunalJudicialActivityRangeMetric"
        reliability:
          type: object
          additionalProperties: false
          required: [level, label, currentSampleSize, exactCourtMatch, limitations]
          properties:
            level:
              type: string
              enum: [insufficient_data, indicative, descriptive, strong]
            label:
              type: string
            currentSampleSize:
              type: integer
              minimum: 0
            exactCourtMatch:
              type: boolean
              const: true
            limitations:
              type: array
              minItems: 1
              items:
                type: string
        provenance:
          type: object
          additionalProperties: false
          required:
            - builderVersion
            - generatedAt
            - courtReferenceSource
            - includedVerificationStatuses
            - excludedPendingOrConflictingSales
          properties:
            builderVersion:
              type: string
              const: tribunal_judicial_activity_v1
            generatedAt:
              type: string
              format: date-time
            courtReferenceSource:
              type: string
              const: justice_open_data
            includedVerificationStatuses:
              type: array
              prefixItems:
                - type: string
                  const: verified
                - type: string
                  const: cross_checked
              minItems: 2
              maxItems: 2
            excludedPendingOrConflictingSales:
              type: boolean
              const: true
    TribunalJudicialActivityDirectoryResponse:
