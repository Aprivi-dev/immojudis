                  label:
                    type: string
                  typeCode:
                    type: [string, "null"]
                  layer:
                    type: string
                  parcelIds:
                    type: array
                    items:
                      type: string
                  documentId:
                    type: [string, "null"]
                  documentUrl:
                    type: [string, "null"]
                  detail:
                    type: string
                  isEnvelope:
