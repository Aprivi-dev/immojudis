        Réservé au plan Analyse. Un compte Découverte y accède seulement avec `saleId`, pour une vente qu'il a débloquée (« 3 déblocages par mois »), et obtient alors les statistiques du tribunal de cette vente, sans la liste de ses autres ventes à venir : `activity.upcomingListings` est alors toujours vide (`activity.upcomingSales` reste renseigné). Une requête avec `courtCode` reste réservée à Analyse. Un paramètre répété est refusé (400). Répond 422 `COURT_UNRESOLVED` quand le rattachement exact au tribunal reste à confirmer.
      security:
        - bearerAuth: []
      parameters:
        - name: courtCode
          in: query
          required: false
          description: >-
            Code du tribunal judiciaire (réservé à l'offre Analyse). Fournir exactement ce
            paramètre ou `saleId`.
          schema:
            type: string
            minLength: 1
            maxLength: 80
            pattern: "^[a-z0-9][a-z0-9:._-]*$"
        - name: saleId
          in: query
          required: false
          description: >-
            Identifiant d'une annonce dont le tribunal judiciaire vérifié sera résolu côté
            serveur. Fournir exactement ce paramètre ou `courtCode`. Pour un compte Découverte,
            la vente doit avoir été débloquée.
          schema:
            type: string
            format: uuid
        - name: historyMonths
          in: query
          required: false
          description: >-
            Fenêtre des ventes passées observées, en mois; 3 par défaut (36 pour
            `/tribunals/judicial-activity`).
          schema:
            type: integer
            enum: [3, 12, 24, 36]
            default: 3
      responses:
        "200":
          description: Statistiques des annonces du tribunal et provenance du calcul.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
