openapi: 3.1.0
info:
  title: ImmoJudis Premium Analytics API
  version: 1.7.0
  description: >-
    Contrats de lecture pour l'activité publique des ventes judiciaires, Outcome
    Graph et les statistiques descriptives expérimentales par tribunal. Les
    registres opérateur, preuves, membres de cohortes et commandes d'écriture
    restent hors de cette API.


    Authentification : toutes les routes exigent le jeton Bearer Supabase d'un
    compte connecté (`Authorization: Bearer <jeton>`) et, sauf mention contraire,
    l'offre Analyse. Les clés d'API ne sont pas acceptées sur ces routes à ce
    jour : seule une session de compte ouvre l'accès.


    Limites : chaque route limite les appels par compte; au-delà, la réponse est
    un 429 avec l'en-tête `Retry-After` (secondes). Une vente inconnue ou retirée
    de la publication renvoie un 404.


    ## Paliers de débit


    Les compteurs sont tenus par compte et par route, sur une fenêtre fixe d'une
    minute. Chaque réponse porte `RateLimit-Limit` et `RateLimit-Remaining`; un 429
    ajoute `Retry-After`.


    | Route | Limite par compte | Plafonds supplémentaires |

    | --- | --- | --- |

    | `/sales/{saleId}/outcome-graph` | 30 appels par minute | aucun |

    | `/sales/{saleId}/adjudication-statistics` | 30 appels par minute | aucun |

    | `/sales/{saleId}/urbanisme-cadastre` | 30 appels par minute | aucun |

    | `/sales/{saleId}/land-report` | 12 appels par minute | plafonds journaliers (jour UTC) : 60 appels par compte, 150 par adresse, 1 500 pour tout le site |

    | `/tribunals/judicial-activity` | 30 appels par minute | aucun |

    | `/tribunals/judicial-activity/directory` | 30 appels par minute | aucun |

    | `/tribunals/statistics` | 30 appels par minute | aucun |

    | `/tribunals/listing-statistics` | 30 appels par minute | aucun |

    | `/tribunals/adjudication-statistics` | 30 appels par minute | aucun |

    | `/tribunals/auction-summaries` | 30 appels par minute | aucun |


    Un plafond journalier atteint renvoie un 429 dont le message l'indique et dont
    `Retry-After` annonce l'attente jusqu'au prochain jour UTC. Ces paliers peuvent
    être relevés sans préavis; une baisse suit la politique de versionnement
    ci-dessous.


    ## Politique de versionnement


    Le numéro de version de ce contrat (`info.version`) suit le principe
    `majeur.mineur.correctif`. Le préfixe `/api/v1` ne change qu'avec une version
    majeure.


    - **Changements compatibles**, sans préavis : ajout d'une route, d'un champ de
      réponse, d'une valeur d'énumération documentée comme extensible, d'un paramètre
      de requête facultatif; relèvement d'un palier de débit. Un client doit
      ignorer les champs qu'il ne connaît pas.

    - **Changements non compatibles**, avec un préavis d'au moins 90 jours :
      retrait ou renommage d'un champ, d'une route ou d'un paramètre, changement du
      sens d'un champ (comme la couche TRI du rapport foncier en `land-report-v1.1`),
      durcissement d'une validation, baisse d'un palier de débit, nouvelle condition
      d'accès. Le changement est annoncé dans ce contrat (description de la route
      concernée) avant son entrée en vigueur.

    - **En-têtes de dépréciation** : dès l'annonce, la route concernée ajoute à ses
      réponses `Deprecation` (date de début de la dépréciation, RFC 9745) et
      `Sunset` (date de retrait, RFC 8594), et l'ancien comportement reste servi
      jusqu'à la date `Sunset`. Un client peut surveiller ces deux en-têtes pour
      être prévenu sans lire ce contrat.

    - **Corrections urgentes** : une correction de sécurité ou de donnée fausse peut
      s'appliquer sans préavis; elle est alors consignée dans la description de la
      route.

    - Les routes marquées expérimentales (statistiques par tribunal, prix
      d'adjudication) peuvent changer de méthode de calcul : leur `methodologyVersion`
      ou leur `builtAt` change alors, sans changer la structure de la réponse.
servers:
  - url: /api/v1
paths:
  /sales/{saleId}/outcome-graph:
    get:
      operationId: getSaleOutcomeGraph
      summary: Lire la dernière prévision Outcome Graph admissible
      description: >-
        Réservé au plan Analyse. Un déblocage de vente (« 3 déblocages par mois ») n'ouvre pas la
        prévision d'audience. Le serveur refuse les prédictions sans snapshot
        pré-audience validé, cohorte éligible ou provenance complète. Le plafond
        personnel n'est pas envoyé à cette route et se calcule dans le navigateur.
      security:
        - bearerAuth: []
      parameters:
        - name: saleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Prévision prête ou refus explicite pour données insuffisantes
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
              schema:
                type: string
              description: Toujours `private, no-store`.
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              examples:
                exemple:
                  summary: Réponse type
                  value:
                    forecast:
                      saleId: 3b1f6c2a-5d4e-4f8a-9b7c-1a2b3c4d5e6f
                      roundId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                      predictionId: 0b8f2f84-0e53-4ab0-8c4e-1d2f3a4b5c6d
                      snapshotId: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                      status: ready
                      generatedAt: 2026-10-30T22:15:00.000Z
                      horizon: T-14
