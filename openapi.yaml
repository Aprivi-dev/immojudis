                $ref: "#/components/schemas/LandSourceCheck"
            warnings:
              type: array
              items:
                type: string
            completeCoverage:
              type: boolean
        risks:
          type: object
          required: [findings, checks, warnings]
          properties:
            findings:
              type: array
              items:
                $ref: "#/components/schemas/LandRiskFinding"
            checks:
              type: array
              items:
                $ref: "#/components/schemas/LandSourceCheck"
            warnings:
              type: array
              items:
                type: string
        rules:
          type: object
          required: [rules, checks, warnings, completeCoverage]
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/LandRuleEvidence"
            checks:
              type: array
              items:
                $ref: "#/components/schemas/LandSourceCheck"
            warnings:
              type: array
              items:
                type: string
            completeCoverage:
              type: boolean
        projects:
          type: array
          description: Analyses de projet (extension, hauteur, construction, division, changement de destination).
          items:
            type: object
            required: [kind, title, status, summary, rules, checks, missingInformation]
            properties:
              kind:
                type: string
                enum: [extension, height, construction, division, destination]
              title:
                type: string
              status:
                type: string
                enum: [conditions_to_review, insufficient_information]
              summary:
                type: string
              rules:
                type: array
                items:
