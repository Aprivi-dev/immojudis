        meta:
          type: object
          additionalProperties: false
          required:
            - generatedAt
            - minSampleSize
            - minSubgroupSampleSize
            - minRangeSampleSize
            - minOverbidCoverage
            - sources
            - publicationDateBasis
            - deduplication
            - rawAnnouncements
            - deduplicatedAnnouncements
            - unresolvedStrongAddressDuplicates
            - outcomeGateApplied
            - limitations
          properties:
            generatedAt:
              type: string
              format: date-time
            minSampleSize:
              type: integer
              const: 10
            minSubgroupSampleSize:
              type: integer
              const: 20
            minRangeSampleSize:
              type: integer
              const: 5
            minOverbidCoverage:
              type: number
              const: 0.5
            sources:
              type: array
              items:
                type: string
                minLength: 1
