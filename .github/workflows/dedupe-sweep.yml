name: Dedupe sweep

# Merges and deletes the duplicate rows already published (reconcile_duplicate_sales_in_supabase).
# The SQL-planned collection runs one source at a time, so the cleanup of src.main (reserved to
# `--source all` without limit) never ran: this manual workflow is the way to run it.
#
# Guards, all kept in src/dedupe_apply.py:
#   * nothing is written until the repository variable DEDUPE_RECONCILE_ENABLED is "true"
#     (read the "Dedupe candidates report" first); DEDUPE_RECONCILE_MODE=candidates keeps it read-only;
#   * at most 100 secondary rows are deleted per pass (run it again for the rest);
#   * the data of the accounts attached to a deleted row moves to the kept sale in the database
#     (migration 20261028110000, to apply before the first real run).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same group as the collection: the sweep deletes catalogue rows and must not overlap a collection.
  group: immojudis-data-pipeline
  cancel-in-progress: false

jobs:
  sweep:
    name: Merge and delete duplicate sales
    runs-on: ubuntu-latest
    # Writes to the production database with the service_role key: same deployment rules as
    # apply-supabase-migrations.yml (the "Production" environment, its protections and secrets).
    environment: Production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      PYTHONUNBUFFERED: "1"
      # Secrets are not part of the job environment: the pip step must not see them.
      DEDUPE_RECONCILE_ENABLED: ${{ vars.DEDUPE_RECONCILE_ENABLED || 'false' }}
      DEDUPE_RECONCILE_MODE: ${{ vars.DEDUPE_RECONCILE_MODE || 'apply' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Merge and delete duplicate sales
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m src.dedupe_apply --output data/audits/dedupe-sweep-candidates.json

      - name: Save the candidate list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dedupe-sweep-candidates
          path: services/data-pipeline/data/audits/dedupe-sweep-candidates.json
          if-no-files-found: ignore
          retention-days: 14
