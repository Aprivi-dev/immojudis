name: Probable duplicate flags

# Pose (ou retire) le drapeau de qualité « probable_duplicate » sur les ventes que le balayage des doublons
# supprimerait (src/probable_duplicates.py). Aucune fusion, aucune suppression : seule la colonne quality_flags des
# lignes qui changent est écrite. Le site refuse la vue aérienne « bâtiment » d'une vente ainsi marquée.
#
# Sans la case « write », c'est un essai à blanc : le journal donne le nombre de drapeaux à poser et à retirer, rien
# n'est écrit. Une collecte qui réécrit une ligne efface son drapeau (le prochain passage le repose) : relancer ce
# workflow après un balayage ou une série de collectes.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "Écrire les drapeaux (sinon : essai à blanc)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Même groupe que la collecte et le balayage : ils réécrivent les mêmes lignes.
  group: immojudis-data-pipeline
  cancel-in-progress: false

jobs:
  flag:
    name: Flag probable duplicates
    runs-on: ubuntu-24.04
    # Évalué avant l'environnement : le workflow n'écrit en production que depuis main, jamais depuis une branche.
    if: github.ref == 'refs/heads/main'
    # Lit (et, avec « write », écrit quality_flags dans) la base de production avec la clé service_role : mêmes
    # règles de déploiement que apply-supabase-migrations.yml (environnement « Production », ses protections et
    # ses secrets).
    environment: Production
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Flag probable duplicates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WRITE_FLAGS: ${{ inputs.write && 'true' || 'false' }}
        run: |
          if [ "$WRITE_FLAGS" = "true" ]; then
            python -m src.probable_duplicates --write
          else
            python -m src.probable_duplicates
          fi
