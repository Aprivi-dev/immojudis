name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes the run of a pull request, never the run of main: each commit merged
  # into main keeps its own verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  manual-collection:
    name: Single-scheduler data collection invariant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm run check:manual-collection

  typecheck:
    name: Web — typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  lint:
    name: Web — lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dead code and unused dependencies (knip, informational)
        continue-on-error: true
        run: npm run knip

  unit:
    name: Web — unit tests and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Static security invariants
        run: npm run test:security-invariants

  audit:
    name: Web — dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        run: npm run check:secrets

  build:
    name: Web — production build and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Cache the Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://ci.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-publishable-key' }}
        run: npm run build
      - name: SSR, bundle and media budgets
        run: npm run build:budgets

  web:
    # Aggregate gate under the historical check name, so branch protection that
    # requires "Web (typecheck + lint)" keeps working now that the jobs run in parallel.
    name: Web (typecheck + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, lint, unit, audit, build]
    # `always()`: without it a failed or cancelled dependency leaves this job "skipped", and a
    # skipped required check is treated as passing by branch protection.
    if: always()
    steps:
      - name: Fail unless every web job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A web job did not succeed (typecheck, lint, unit, audit or build)."
              exit 1
            fi
          done
          echo "Typecheck, lint, tests, audit and build passed."

  pipeline-py311:
    # pyproject.toml now requires CPython 3.12 (the hashed lockfiles, numpy 2.5.3 among them, are
    # resolved for 3.12 only), so a 3.11 compile check no longer proves anything. Branch protection
    # still requires the historical check name "Data pipeline (Python 3.11)": keep it as an aggregate
    # gate on the real pipeline job (as `web` does above) until it is removed from the required
    # checks in the repository settings, then delete this job.
    name: Data pipeline (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pipeline]
    # `always()`: without it a failed pipeline leaves this gate "skipped", which branch
    # protection treats as passing.
    if: always()
    steps:
      - name: Fail unless the data pipeline job succeeded
        env:
          PIPELINE_RESULT: ${{ needs.pipeline.result }}
        run: |
          if [ "$PIPELINE_RESULT" != "success" ]; then
            echo "::error::The data pipeline job did not succeed (result: $PIPELINE_RESULT)."
            exit 1
          fi
          echo "Data pipeline (Python 3.12) passed; Python 3.11 is no longer supported."

  pipeline:
    name: Data pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The hashed lockfiles are resolved for CPython 3.12, the version every
        # workflow runs.
        python-version: ["3.12"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pipeline-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PIPELINE_TEST_DB_URL: postgresql://postgres:pipeline-test-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/data-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            services/data-pipeline/requirements.lock
            services/data-pipeline/requirements-dev.lock
            services/data-pipeline/requirements-valuation.lock
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install the valuation stack (LightGBM, MAPIE, H3) for the training tests
        run: python -m pip install --require-hashes -r requirements-valuation.lock
      - name: Resolve the optional Docling stack
        run: python -m pip install --dry-run -r requirements-docling.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Audit direct and transitive Python dependencies
        run: |
          set -euo pipefail
          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT
          audit() {
            for attempt in 1 2 3; do
              if python -m pip_audit "$@" >"$audit_log" 2>&1; then
                cat "$audit_log"
                return 0
              fi
              cat "$audit_log"
              # PyPI may briefly return a 503 for a package JSON endpoint.
              # Do not retry genuine vulnerability findings or other failures.
              if [[ "$(<"$audit_log")" != *"requests.exceptions.HTTPError: 503 Server Error"* ]]; then
                return 1
              fi
              if [ "$attempt" -eq 3 ]; then
                # OSV is a supported independent advisory source. Keep the
                # security gate active if PyPI's JSON vulnerability API is down.
                echo "::warning::PyPI returned 503 three times; auditing with OSV instead."
                python -m pip_audit "$@" --vulnerability-service osv
                return 0
              fi
              sleep "$((attempt * 10))"
            done
          }
          # Production runtime (what data-pipeline.yml installs): no exception.
          audit -r requirements.txt
          # What is really installed: the hashed lockfiles (data-pipeline.yml installs
          # requirements.lock; CI and model training install the other two). They pin every
          # transitive dependency, so no resolution is needed (--no-deps). No exception.
          for lockfile in requirements.lock requirements-dev.lock requirements-valuation.lock; do
            audit -r "$lockfile" --no-deps --disable-pip
          done
          # Optional Docling extractor, never installed by the production workflows. Every
          # Docling release so far (docling-core, docling-parse, docling-ibm-models) requires
          # pillow<13, so it resolves pillow 12.3.0 and its advisories fixed only in pillow
          # 13.0.0 (TIFF, GIF, PPM, EPS decoders, PDF append) cannot be fixed here yet. They are
          # ignored for this audit only; anything else still fails. Remove these ignores as soon
          # as a Docling release accepts pillow 13 (and bump requirements-docling.txt).
          # Review deadline: 2026-11-30. Past it the audit still passes but prints a warning on
          # every run: check whether a Docling release accepts pillow 13, then drop the ignores
          # or push the date back with a reason. The ignores are advisory identifiers, specific
          # to pillow 12; pip-audit cannot scope an ignore to a package.
          pillow_12_review_by="2026-11-30"
          if [[ "$(date -u +%F)" > "$pillow_12_review_by" ]]; then
            echo "::warning::The pillow 12 audit exceptions in ci.yml are past their review date ($pillow_12_review_by): check whether Docling now accepts pillow 13."
          fi
          pillow_12_advisories=(
            CVE-2026-112395 CVE-2026-112397 CVE-2026-112400 CVE-2026-112404
            CVE-2026-112895 CVE-2026-112896 CVE-2026-112897 CVE-2026-112899
            GHSA-462x-pgg6-55fp GHSA-58r4-6rv3-gfh8 GHSA-65qm-jvmh-6pqg GHSA-c6hw-5grf-ff96
            GHSA-p4wg-p73j-c528 GHSA-pchr-8j38-3x4p GHSA-q45j-58j2-45rg GHSA-vx6w-vv9f-6gvg
            # Reported since 21/10/2026, also fixed only in pillow 13.0.0 (docling-core 2.103.1
            # still requires pillow<13).
            CVE-2026-112390 CVE-2026-112391 CVE-2026-112392 CVE-2026-112393
            CVE-2026-112396 CVE-2026-112399 CVE-2026-112401 CVE-2026-112402
            CVE-2026-112405 CVE-2026-112406 CVE-2026-112891 CVE-2026-112892
            CVE-2026-112893 CVE-2026-112894 CVE-2026-112900 CVE-2026-112901
            # Reported on 22/10/2026, also fixed only in pillow 13.0.0 (Docling still resolves
            # pillow 12.3.0).
            CVE-2026-96636 CVE-2026-96637 CVE-2026-96638 CVE-2026-96639
            CVE-2026-96640 CVE-2026-96641 CVE-2026-96642 CVE-2026-96643
            CVE-2026-96644 CVE-2026-96778
            # Reported on 23/10/2026 (pillow 12.3.0 via Docling), fixed only in pillow 13.0.0.
            GHSA-78g4-xqwv-q3g8
          )
          ignore_args=()
          for advisory in "${pillow_12_advisories[@]}"; do ignore_args+=(--ignore-vuln "$advisory"); done
          audit -r requirements-docling.txt "${ignore_args[@]}"

  database:
    name: Supabase migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Fetch the base branch for the migration order check
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: Validate migration versions
        env:
          # A migration added by a pull request must be newer than the latest one on its base.
          MIGRATIONS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: npm run check:migrations
      - name: Start local Supabase
        run: npx --yes supabase@2.110.0 start
      - name: Replay migrations from zero
        run: npx --yes supabase@2.110.0 db reset --local --no-seed --log-level error
      - name: Check generated database types are up to date
        # passe en bloquant dès que le fichier a été régénéré par le CLI
        # (retirer `continue-on-error` après un premier `npm run db:types` local).
        continue-on-error: true
        run: |
          set -euo pipefail
          generated="$(mktemp --suffix=.ts)"
          trap 'rm -f "$generated"' EXIT
          npx --yes supabase@2.110.0 gen types typescript --local > "$generated"
          # Le fichier commité est formaté par Prettier (npm run format) : même formatage ici.
          npx prettier --config .prettierrc --write "$generated"
          if ! diff -u src/integrations/supabase/types.ts "$generated"; then
            echo "::error file=src/integrations/supabase/types.ts::Types périmés : lancer 'npm run db:types' et committer le résultat."
            exit 1
          fi
      - name: Detect migration drift
        run: npm run check:schema-drift
      - name: Apply local concurrent index operations
        env:
          POSTGRES_SSL: disable
        run: |
          set -euo pipefail
          status_path="$(mktemp)"
          trap 'rm -f "$status_path"' EXIT
          npx --yes supabase@2.110.0 status --output json > "$status_path"
          database_url="$(jq -r '.DB_URL // empty' "$status_path")"
          test -n "$database_url"
          SUPABASE_DB_URL="$database_url" node scripts/apply-supabase-concurrent-index-operations.mjs
      - name: Run concurrent quota test
        run: npm run test:db-concurrency
      - name: Run database tests
        run: npx --yes supabase@2.110.0 test db
      - name: Check public catalogue over HTTP
        run: |
          status_path="$(mktemp)"
          trap 'rm -f "$status_path"' EXIT
          npx --yes supabase@2.110.0 status --output json > "$status_path"
          node scripts/check-local-catalogue.mjs "$status_path"
      - name: Export local Supabase integration environment
        run: |
          status_path="$(mktemp)"
          trap 'rm -f "$status_path"' EXIT
          npx --yes supabase@2.110.0 status --output json > "$status_path"
          api_url="$(jq -r '.API_URL // empty' "$status_path")"
          database_url="$(jq -r '.DB_URL // empty' "$status_path")"
          service_role_key="$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' "$status_path")"
          publishable_key="$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY // empty' "$status_path")"
          test -n "$api_url"
          test -n "$database_url"
          test -n "$service_role_key"
          test -n "$publishable_key"
          {
            echo "SUPABASE_URL=$api_url"
            echo "SUPABASE_DB_URL=$database_url"
            echo "NEXT_PUBLIC_SUPABASE_URL=$api_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publishable_key"
            echo "IMMOJUDIS_LOCAL_INTEGRATION=true"
          } >> "$GITHUB_ENV"
      - name: Run information-agent local integration
        run: npx vitest run src/lib/information-agent-local.integration.test.ts --reporter=verbose
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.110.0 stop --no-backup

  e2e:
    name: Investor journey (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser journeys and accessibility checks
        run: npm run test:e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
