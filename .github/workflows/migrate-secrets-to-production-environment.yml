name: Migrate secrets to the Production environment

# One-off (audit du 16/11/2026, constat n° 3). Recopie les secrets de dépôt lus par les workflows de
# production vers l'environnement `Production`, restreint à `main`. GitHub ne laisse lire la valeur
# d'un secret à personne : seul un job peut la recopier. Aucune valeur n'est affichée, écrite dans un
# fichier ni passée en argument de commande (elle est lue sur l'entrée standard de `gh`).
#
# Mode d'emploi : docs/runbooks/migration-secrets-environnement.md. À supprimer, avec le secret
# SECRETS_MIGRATION_TOKEN, une fois la migration vérifiée.

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type production to copy the repository secrets into the Production environment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: immojudis-secrets-migration
  cancel-in-progress: false

jobs:
  copy:
    name: Copy repository secrets into the Production environment
    # Only the code of `main` may read these secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check confirmation and token
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          GH_TOKEN: ${{ secrets.SECRETS_MIGRATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_TARGET" != "production" ]; then
            echo "confirm_target must be exactly: production" >&2
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "SECRETS_MIGRATION_TOKEN is missing: see docs/runbooks/migration-secrets-environnement.md" >&2
            exit 1
          fi

      # No checkout and no third-party action: this job runs nothing but `gh`, preinstalled on the runner.
      - name: Copy each secret, value on stdin
        env:
          GH_TOKEN: ${{ secrets.SECRETS_MIGRATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VALUE_CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VALUE_JUDILIBRE_KEY_ID: ${{ secrets.JUDILIBRE_KEY_ID }}
          VALUE_REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          VALUE_SOURCE_FETCH_RELAY_TOKEN: ${{ secrets.SOURCE_FETCH_RELAY_TOKEN }}
          VALUE_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VALUE_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VALUE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VALUE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          copied=0
          for name in CRON_SECRET JUDILIBRE_KEY_ID REPLICATE_API_TOKEN SOURCE_FETCH_RELAY_TOKEN \
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            variable="VALUE_${name}"
            value="${!variable}"
            if [ -z "$value" ]; then
              # A repository secret already deleted (second run): the environment keeps its copy.
              echo "skipped ${name}: no repository secret of that name"
              continue
            fi
            printf '%s' "$value" | gh secret set "$name" --env Production >/dev/null
            echo "copied ${name}"
            copied=$((copied + 1))
          done
          echo "${copied} secret(s) copied into the Production environment."
