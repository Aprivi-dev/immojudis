name: Dedupe candidates report

# Read-only: lists the duplicate pairs the catalogue sweep (DEDUPE_RECONCILE_ENABLED) would merge, so the
# owner can review them before switching the sweep on. Nothing is written to the database
# (docs/runbooks/chantier-f-reparations-donnees.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immojudis-dedupe-candidates
  cancel-in-progress: false

jobs:
  report:
    name: List duplicate candidates
    runs-on: ubuntu-latest
    # Lit la base de production avec la clé service_role : mêmes règles de déploiement que
    # apply-supabase-migrations.yml (environnement « Production », ses protections et ses secrets).
    environment: Production
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: List duplicate candidates without writing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.dedupe_candidates --output data/audits/dedupe-candidates.json

      - name: Save the candidate list
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dedupe-candidates
          path: services/data-pipeline/data/audits/dedupe-candidates.json
          if-no-files-found: warn
          retention-days: 14
