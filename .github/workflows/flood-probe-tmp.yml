name: Flood source probe (temporary)
on:
  push:
    branches: [claude/flood-probe-tmp]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: curl (read-only, no secret)
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "curl tri %{http_code}\n" --max-time 15 -A "immojudis-flood-risk/1.0 (+https://immojudis.com)" "https://www.georisques.gouv.fr/api/v1/tri_zonage?latlon=0.689,47.399" || echo "curl tri FAIL"
          done
      - name: node fetch (read-only, no secret)
        run: node .github/probe-burst.mjs
      - name: node fetch with a different User-Agent
        run: sed -i 's#immojudis-flood-risk/1.0 (+https://immojudis.com)#Mozilla/5.0 (compatible; ImmojudisBot/1.0; +https://immojudis.com/contact)#' .github/probe-burst.mjs && node .github/probe-burst.mjs
