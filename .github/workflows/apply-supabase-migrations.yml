name: Apply Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type production to apply the audited Supabase migrations"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: immojudis-supabase-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Apply audited migrations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_MIGRATION_RUNNER: postgres-js
      PGCONNECT_TIMEOUT: "600"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      OPERATIONS_HEALTH_URL: https://immojudis-dezt.vercel.app
    steps:
      - name: Check target confirmation
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm_target }}" != "production" ]; then
            echo "confirm_target must be exactly: production" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Install project tooling
        run: npm ci --ignore-scripts

      - name: Apply pending migrations
        run: node scripts/apply-supabase-migrations.mjs

      - name: Configure the 15-minute health scheduler
        run: npm run ops:health-scheduler:configure

      - name: Detect production schema drift
        run: npm run check:schema-drift -- --remote
