name: Reference data import

# Official open data behind the "Risques environnementaux" and "Historique
# météo" blocks of a listing: communes (geo.api.gouv.fr), GASPAR risks
# (Géorisques) and Météo-France monthly climatology, plus the ANIL rent map
# (`rents`, yearly in December) and the rental-tension zoning (`tension`, after a
# decree). Sources refresh at most monthly, so the import stays manual like every
# other collection workflow (single-scheduler invariant). From November to January, run it
# by hand with `check_new_vintage` to look for the next ANIL edition (writes nothing).
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset to import."
        required: true
        default: all
        type: choice
        options:
          - all
          - communes
          - risks
          - climate
          - rents
          - tension
          # Not part of `all`: the table comes with migration 20261108120200 (INSEE commune changes).
          - commune_history
      dry_run:
        description: "Download and parse without writing to Supabase."
        required: false
        default: false
        type: boolean
      check_new_vintage:
        description: "Only look for a newer ANIL edition (writes nothing, ignores the dataset)."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: immojudis-reference-data-import
  cancel-in-progress: false

jobs:
  import:
    # Receives SUPABASE_DB_URL: only the code of `main` may run with it (a dispatch from another branch
    # would run that branch's code with the production secret).
    if: github.ref == 'refs/heads/main'
    name: Import official reference data
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/data-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check for a new ANIL vintage
        if: github.event.inputs.check_new_vintage == 'true'
        env:
          AUCTION_USER_AGENT: ${{ vars.AUCTION_USER_AGENT || 'ImmojudisBot/1.0 (+https://immojudis.com/contact)' }}
        run: python -m src.reference_data rents --check-new-vintage

      - name: Import reference data
        if: github.event.inputs.check_new_vintage != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AUCTION_USER_AGENT: ${{ vars.AUCTION_USER_AGENT || 'ImmojudisBot/1.0 (+https://immojudis.com/contact)' }}
          REQUESTED_DATASET: ${{ github.event.inputs.dataset }}
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=("${REQUESTED_DATASET:-all}")
          if [ "${REQUESTED_DRY_RUN:-false}" = "true" ]; then
            args+=("--dry-run")
          fi
          python -m src.reference_data "${args[@]}"

      - name: Summarize the failure
        if: failure()
        env:
          REQUESTED_DATASET: ${{ github.event.inputs.dataset }}
          REQUESTED_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          {
            echo "## Reference data import failed"
            echo
            echo "- Dataset: \`${REQUESTED_DATASET:-all}\` (dry run: \`${REQUESTED_DRY_RUN:-false}\`)"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- The \`::error::\` annotations name each dataset that failed; a snapshot table (ANIL rents, rental-tension zoning) is rolled back as a whole, so it still holds its previous edition."
            echo "- Nothing was retried: relaunch the workflow once the cause is fixed (the imports are idempotent)."
          } >> "$GITHUB_STEP_SUMMARY"
