name: Production smoke

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Public journey and API
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check production availability, supervision, court pages, catalogue caches and search-engine signals
        # Whatever the indexing state, the script also checks the public catalogue and its caches:
        # two successive requests to /sales (the second one `x-vercel-cache: HIT`, no Set-Cookie, no
        # Vary beyond the Next.js router headers, sale links in the HTML), /sales/defaut in noindex,
        # at least 20 listings in the HTML of /sales?page=2, a public cache-control on
        # /api/catalogue/preview, and no sitemap listing /sales/defaut (when indexing is open).
        #
        # Supervision and court pages (docs/operations/supervision-externe.md): /api/health must answer
        # with a fresh body (`checkedAt` at most 120 s old; its cache-control is rewritten by Vercel and
        # is not checked), the database must answer, and `operational-health` must have run within 60
        # minutes. A late collection only fails the job beyond 72 hours (below, it is reported in the
        # result as `degraded-tolerated`). GitHub does not keep the "every 30 minutes" schedule:
        # intervals of 2 to 6 hours were observed, so this job does not replace an external probe.
        # A known court (/tribunaux/justice-tj-1-93) answers 200; its old address (/tribunaux/bobigny)
        # answers a single 308 to a /tribunaux/justice-tj-... address; an unknown court answers 404;
        # /audiences-a-venir does not say "momentanément indisponibles"; and, when indexing is open,
        # /sitemap.xml lists at least 10 /tribunaux/justice-tj-... pages (--min-tribunal-urls). An
        # unavailable hearings page fails this job until it is repaired.
        #
        # The script must know which indexing state to expect: the repository variable
        # SEO_INDEXING_ENABLED (Settings > Secrets and variables > Actions > Variables) mirrors
        # the Vercel variable of the same name. "true" = open (robots.txt with sitemaps, no
        # X-Robots-Tag, a sale taken from the sitemap); any other value = closed (noindex on
        # every response, robots.txt without sitemap). Production indexing was opened on
        # 2026-10-15, so an absent variable means "expect open": an accidental closure is then
        # caught. To close indexing, set Vercel to anything but "true" and this variable to
        # "false" at the same time.
        env:
          SEO_INDEXING_ENABLED: ${{ vars.SEO_INDEXING_ENABLED || 'true' }}
        run: node scripts/check-production-smoke.mjs --origin https://immojudis.com
