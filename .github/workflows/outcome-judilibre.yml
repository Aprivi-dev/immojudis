name: Outcome Graph - Judilibre synchronization

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Show the plan, bootstrap a targeted profile, or refresh tracked decisions"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - bootstrap
          - sync
      profile:
        description: "Allow-listed judicial-sale search profile; only used for bootstrap"
        required: true
        default: saisie_immobiliere_v2
        type: choice
        options:
          - saisie_immobiliere_v2
          - vente_forcee_v2
          - adjudication_v2
          - adjuge_v2
          - mise_a_prix_v2
          - surenchere_v2
      date_start:
        description: "Bootstrap start date (YYYY-MM-DD); required for bootstrap"
        required: false
        type: string
      date_end:
        description: "Bootstrap end date (YYYY-MM-DD); required for bootstrap"
        required: false
        type: string
      max_results_per_window:
        description: "Maximum results in one adaptive date window (1..500)"
        required: true
        default: "250"
        type: string
      max_total_results:
        description: "Maximum results fetched across the complete bootstrap (1..10000)"
        required: true
        default: "500"
        type: string
      since:
        description: "Tracked-sync ISO-8601 boundary; only used when no checkpoint exists"
        required: false
        type: string
      max_pages:
        description: "Tracked-history page budget; a timestamp cohort may require lookahead"
        required: true
        default: "10"
        type: string
      max_records:
        description: "Tracked-history record budget; one timestamp cohort is never split"
        required: true
        default: "1000"
        type: string
      max_segments:
        description: "Maximum durable tracked-history segments in this run (1..20)"
        required: true
        default: "1"
        type: string
      confirm_bootstrap:
        description: "Type BOOTSTRAP-JUDILIBRE-TARGETED when operation=bootstrap"
        required: false
        type: string
      confirm_sync:
        description: "Type SYNC-JUDILIBRE-TRACKED-ONLY when operation=sync"
        required: false
        type: string
      refresh_justice_references:
        description: "Refresh and ingest the verified official Justice court registry before matching"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: immojudis-outcome-judilibre-sync
  cancel-in-progress: false

jobs:
  gate:
    name: Enforce closed-by-default activation gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_plan: ${{ steps.gate.outputs.should_plan }}
      should_bootstrap: ${{ steps.gate.outputs.should_bootstrap }}
      should_sync: ${{ steps.gate.outputs.should_sync }}
    env:
      REPOSITORY_ENABLED: ${{ vars.JUDILIBRE_ENABLED || 'false' }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_PROFILE: ${{ inputs.profile || 'adjudication_v2' }}
      REQUESTED_DATE_START: ${{ inputs.date_start }}
      REQUESTED_DATE_END: ${{ inputs.date_end }}
      REQUESTED_MAX_RESULTS_PER_WINDOW: ${{ inputs.max_results_per_window || '250' }}
      REQUESTED_MAX_TOTAL_RESULTS: ${{ inputs.max_total_results || '500' }}
      REQUESTED_MAX_PAGES: ${{ inputs.max_pages || '10' }}
      REQUESTED_MAX_RECORDS: ${{ inputs.max_records || '1000' }}
      REQUESTED_MAX_SEGMENTS: ${{ inputs.max_segments || '1' }}
      REQUESTED_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirm_bootstrap }}
      REQUESTED_SYNC_CONFIRMATION: ${{ inputs.confirm_sync }}
    steps:
      - name: Evaluate activation and bounds
        id: gate
        run: |
          set -euo pipefail

          write_output() {
            printf '%s\n' "$1" >> "$GITHUB_OUTPUT"
          }

          write_output "should_plan=false"
          write_output "should_bootstrap=false"
          write_output "should_sync=false"

          if [ "$REQUESTED_OPERATION" = "plan" ]; then
            write_output "should_plan=true"
            exit 0
          fi
          if [ "$REQUESTED_OPERATION" != "bootstrap" ] && [ "$REQUESTED_OPERATION" != "sync" ]; then
            echo "operation must be plan, bootstrap or sync" >&2
            exit 1
          fi

          if [ "$REPOSITORY_ENABLED" != "true" ]; then
            echo "Repository variable JUDILIBRE_ENABLED must be exactly true" >&2
            exit 1
          fi

          if [ "$REQUESTED_OPERATION" = "bootstrap" ]; then
            if [ "$REQUESTED_BOOTSTRAP_CONFIRMATION" != "BOOTSTRAP-JUDILIBRE-TARGETED" ]; then
              echo "confirm_bootstrap must be exactly BOOTSTRAP-JUDILIBRE-TARGETED" >&2
              exit 1
            fi
            case "$REQUESTED_PROFILE" in
              saisie_immobiliere_v2|vente_forcee_v2|adjudication_v2|adjuge_v2|mise_a_prix_v2|surenchere_v2) ;;
              *)
                echo "profile is not an approved targeted-search profile" >&2
                exit 1
                ;;
            esac
            if ! [[ "$REQUESTED_DATE_START" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
              ! [[ "$REQUESTED_DATE_END" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "date_start and date_end are required in YYYY-MM-DD format" >&2
              exit 1
            fi
            start_canonical="$(date -u -d "${REQUESTED_DATE_START}T00:00:00Z" +%F 2>/dev/null || true)"
            end_canonical="$(date -u -d "${REQUESTED_DATE_END}T00:00:00Z" +%F 2>/dev/null || true)"
            if [ "$start_canonical" != "$REQUESTED_DATE_START" ] ||
              [ "$end_canonical" != "$REQUESTED_DATE_END" ]; then
              echo "date_start and date_end must be valid calendar dates" >&2
              exit 1
            fi
            start_epoch="$(date -u -d "${REQUESTED_DATE_START}T00:00:00Z" +%s)"
            end_epoch="$(date -u -d "${REQUESTED_DATE_END}T00:00:00Z" +%s)"
            inclusive_days=$(( (end_epoch - start_epoch) / 86400 + 1 ))
            if [ "$inclusive_days" -lt 1 ] || [ "$inclusive_days" -gt 31 ]; then
              echo "bootstrap date window must contain between 1 and 31 calendar days" >&2
              exit 1
            fi
            if ! [[ "$REQUESTED_MAX_RESULTS_PER_WINDOW" =~ ^[0-9]+$ ]] ||
              [ "$REQUESTED_MAX_RESULTS_PER_WINDOW" -lt 1 ] ||
              [ "$REQUESTED_MAX_RESULTS_PER_WINDOW" -gt 500 ]; then
              echo "max_results_per_window must be an integer between 1 and 500" >&2
              exit 1
            fi
            if ! [[ "$REQUESTED_MAX_TOTAL_RESULTS" =~ ^[0-9]+$ ]] ||
              [ "$REQUESTED_MAX_TOTAL_RESULTS" -lt 1 ] ||
              [ "$REQUESTED_MAX_TOTAL_RESULTS" -gt 10000 ]; then
              echo "max_total_results must be an integer between 1 and 10000" >&2
              exit 1
            fi
            if [ "$REQUESTED_MAX_RESULTS_PER_WINDOW" -gt "$REQUESTED_MAX_TOTAL_RESULTS" ]; then
              echo "max_results_per_window must not exceed max_total_results" >&2
              exit 1
            fi

            write_output "should_bootstrap=true"
            exit 0
          fi

          if [ "$REQUESTED_SYNC_CONFIRMATION" != "SYNC-JUDILIBRE-TRACKED-ONLY" ]; then
            echo "confirm_sync must be exactly SYNC-JUDILIBRE-TRACKED-ONLY" >&2
            exit 1
          fi
          if ! [[ "$REQUESTED_MAX_PAGES" =~ ^[0-9]+$ ]] ||
            [ "$REQUESTED_MAX_PAGES" -lt 1 ] || [ "$REQUESTED_MAX_PAGES" -gt 50 ]; then
            echo "max_pages must be an integer between 1 and 50" >&2
            exit 1
          fi
          if ! [[ "$REQUESTED_MAX_RECORDS" =~ ^[0-9]+$ ]] ||
            [ "$REQUESTED_MAX_RECORDS" -lt 1 ] || [ "$REQUESTED_MAX_RECORDS" -gt 5000 ]; then
            echo "max_records must be an integer between 1 and 5000" >&2
            exit 1
          fi
          if ! [[ "$REQUESTED_MAX_SEGMENTS" =~ ^[0-9]+$ ]] ||
            [ "$REQUESTED_MAX_SEGMENTS" -lt 1 ] || [ "$REQUESTED_MAX_SEGMENTS" -gt 20 ]; then
            echo "max_segments must be an integer between 1 and 20" >&2
            exit 1
          fi

          write_output "should_sync=true"

  plan:
    name: Show source activation plan
    needs: gate
    if: needs.gate.outputs.should_plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/data-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Print secret-free activation plan
        env:
          JUDILIBRE_ENABLED: "false"
          JUDILIBRE_DRY_RUN: "true"
        run: python -m src.outcome_sources_cli plan

  ingest:
    name: Run gated Judilibre ingestion
    needs: gate
    if: >-
      needs.gate.outputs.should_bootstrap == 'true' ||
      needs.gate.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      JUDILIBRE_ENABLED: ${{ vars.JUDILIBRE_ENABLED }}
      JUDILIBRE_DRY_RUN: "false"
      JUDILIBRE_BASE_URL: ${{ vars.JUDILIBRE_BASE_URL }}
      JUDILIBRE_AUTH_MODE: ${{ vars.JUDILIBRE_AUTH_MODE || 'auto' }}
      JUDILIBRE_OAUTH_TOKEN_URL: ${{ vars.JUDILIBRE_OAUTH_TOKEN_URL }}
      JUDILIBRE_OAUTH_SCOPE: ${{ vars.JUDILIBRE_OAUTH_SCOPE || 'openid' }}
      JUDILIBRE_OAUTH_CLIENT_AUTH_METHOD: ${{ vars.JUDILIBRE_OAUTH_CLIENT_AUTH_METHOD || 'basic' }}
      JUDILIBRE_HISTORY_PAGE_SIZE: ${{ vars.JUDILIBRE_HISTORY_PAGE_SIZE || '100' }}
      JUDILIBRE_TIMEOUT_SECONDS: ${{ vars.JUDILIBRE_TIMEOUT_SECONDS || '20' }}
      JUDILIBRE_MAX_RETRIES: ${{ vars.JUDILIBRE_MAX_RETRIES || '4' }}
      JUDILIBRE_RETRY_BACKOFF_SECONDS: ${{ vars.JUDILIBRE_RETRY_BACKOFF_SECONDS || '1' }}
      JUDILIBRE_RETRY_MAX_SLEEP_SECONDS: ${{ vars.JUDILIBRE_RETRY_MAX_SLEEP_SECONDS || '30' }}
      REQUESTED_PROFILE: ${{ inputs.profile || 'adjudication_v2' }}
      REQUESTED_DATE_START: ${{ inputs.date_start }}
      REQUESTED_DATE_END: ${{ inputs.date_end }}
      REQUESTED_MAX_RESULTS_PER_WINDOW: ${{ inputs.max_results_per_window || '250' }}
      REQUESTED_MAX_TOTAL_RESULTS: ${{ inputs.max_total_results || '500' }}
      REQUESTED_SINCE: ${{ inputs.since }}
      REQUESTED_MAX_PAGES: ${{ inputs.max_pages || '10' }}
      REQUESTED_MAX_RECORDS: ${{ inputs.max_records || '1000' }}
      REQUESTED_MAX_SEGMENTS: ${{ inputs.max_segments || '1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate server and PISTE credentials
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JUDILIBRE_KEY_ID: ${{ secrets.JUDILIBRE_KEY_ID }}
          JUDILIBRE_OAUTH_CLIENT_ID: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_ID }}
          JUDILIBRE_OAUTH_CLIENT_SECRET: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          required_variables=(SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY JUDILIBRE_BASE_URL)
          for variable_name in "${required_variables[@]}"; do
            if [ -z "${!variable_name:-}" ]; then
              echo "$variable_name is required for Judilibre synchronization" >&2
              exit 1
            fi
          done

          has_key_id=false
          has_oauth=false
          [ -n "${JUDILIBRE_KEY_ID:-}" ] && has_key_id=true
          if [ -n "${JUDILIBRE_OAUTH_CLIENT_ID:-}" ] && [ -n "${JUDILIBRE_OAUTH_CLIENT_SECRET:-}" ]; then
            has_oauth=true
          fi

          case "$JUDILIBRE_AUTH_MODE" in
            auto)
              if [ "$has_key_id" != "true" ] && [ "$has_oauth" != "true" ]; then
                echo "Configure JUDILIBRE_KEY_ID or complete OAuth2 client secrets" >&2
                exit 1
              fi
              ;;
            keyid)
              [ "$has_key_id" = "true" ] || {
                echo "JUDILIBRE_KEY_ID is required for keyid mode" >&2
                exit 1
              }
              ;;
            oauth2)
              [ "$has_oauth" = "true" ] || {
                echo "Complete Judilibre OAuth2 client secrets are required" >&2
                exit 1
              }
              ;;
            keyid+oauth2)
              if [ "$has_key_id" != "true" ] || [ "$has_oauth" != "true" ]; then
                echo "KeyId and complete OAuth2 client secrets are required for combined mode" >&2
                exit 1
              fi
              ;;
            *)
              echo "JUDILIBRE_AUTH_MODE must be auto, keyid, oauth2 or keyid+oauth2" >&2
              exit 1
              ;;
          esac

      - name: Refresh verified official Justice court registry
        if: inputs.refresh_justice_references == true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          justice_reference_dir="$RUNNER_TEMP/justice-references"
          python -m src.official_sources.justice_reference_sync \
            --output-dir "$justice_reference_dir" \
            --no-cache-fallback
          python -m src.outcome_sources_cli validate-local \
            justice \
            "$justice_reference_dir/2026-domaine-juridique-adresse.csv"
          python -m src.outcome_sources_cli ingest-local \
            justice \
            "$justice_reference_dir/2026-domaine-juridique-adresse.csv" \
            --all \
            --workers 8

      - name: Verify the live Judilibre contract without writing data
        env:
          JUDILIBRE_KEY_ID: ${{ secrets.JUDILIBRE_KEY_ID }}
          JUDILIBRE_OAUTH_CLIENT_ID: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_ID }}
          JUDILIBRE_OAUTH_CLIENT_SECRET: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_SECRET }}
        run: python scripts/check_judilibre_contract.py

      - name: Bootstrap one bounded targeted-search profile
        if: needs.gate.outputs.should_bootstrap == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JUDILIBRE_KEY_ID: ${{ secrets.JUDILIBRE_KEY_ID }}
          JUDILIBRE_OAUTH_CLIENT_ID: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_ID }}
          JUDILIBRE_OAUTH_CLIENT_SECRET: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          python -m src.outcome_sources_cli judilibre-search-sync \
            --profile "$REQUESTED_PROFILE" \
            --date-start "$REQUESTED_DATE_START" \
            --date-end "$REQUESTED_DATE_END" \
            --max-results-per-window "$REQUESTED_MAX_RESULTS_PER_WINDOW" \
            --max-total-results "$REQUESTED_MAX_TOTAL_RESULTS"

      - name: Refresh tracked decisions from the durable checkpoint
        if: needs.gate.outputs.should_sync == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JUDILIBRE_KEY_ID: ${{ secrets.JUDILIBRE_KEY_ID }}
          JUDILIBRE_OAUTH_CLIENT_ID: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_ID }}
          JUDILIBRE_OAUTH_CLIENT_SECRET: ${{ secrets.JUDILIBRE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          for segment_number in $(seq 1 "$REQUESTED_MAX_SEGMENTS"); do
            args=(
              judilibre-sync
              --stream-key transactional_history
              --max-pages "$REQUESTED_MAX_PAGES"
              --max-records "$REQUESTED_MAX_RECORDS"
            )
            if [ -n "$REQUESTED_SINCE" ]; then
              args+=(--since "$REQUESTED_SINCE")
            fi

            segment_summary="$(python -m src.outcome_sources_cli "${args[@]}")"
            echo "$segment_summary"
            scan_complete="$(python -c \
              'import json, sys; print(json.loads(sys.argv[1])["scan_complete"])' \
              "$segment_summary")"
            if [ "$scan_complete" = "True" ]; then
              echo "Judilibre transactional history reached its terminal page in segment $segment_number"
              break
            fi
          done

      - name: Propagate upstream deletions and clean private Storage orphans
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python scripts/run_outcome_retention.py
          --max-jobs 500
          --orphan-limit 500
          --orphan-grace-hours 24

      - name: Build review-only Judilibre match candidates
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: >-
          python scripts/match_judilibre_candidates.py
          --limit 2000
          --persist

      - name: Publish bounded run summary
        if: always()
        run: |
          {
            echo "## Outcome Graph - Judilibre"
            echo
            echo "- Repository gate: \`JUDILIBRE_ENABLED=true\`"
            echo "- Trigger: ${{ github.event_name }}"
            if [ "${{ needs.gate.outputs.should_bootstrap }}" = "true" ]; then
              echo "- Operation: targeted-search bootstrap"
              echo "- Profile: \`$REQUESTED_PROFILE\`"
              echo "- Date window: \`$REQUESTED_DATE_START\` through \`$REQUESTED_DATE_END\`"
              echo "- Per-window result ceiling: \`$REQUESTED_MAX_RESULTS_PER_WINDOW\`"
              echo "- Global result ceiling: \`$REQUESTED_MAX_TOTAL_RESULTS\`"
            else
              echo "- Operation: bounded transactional refresh of tracked decisions only"
              echo "- Stream key: \`transactional_history\`"
              echo "- Page budget: \`$REQUESTED_MAX_PAGES\`"
              echo "- Record budget: \`$REQUESTED_MAX_RECORDS\`"
              echo "- Segment budget: \`$REQUESTED_MAX_SEGMENTS\`"
            fi
            echo "- Raw decision artifact uploaded to Actions: no"
            echo "- Physical source-deletion propagation: enabled"
            echo "- Official Justice court registry: explicit manual refresh only"
            echo "- Match publication: review-only; no automatic outcome"
            echo "- Successful bounded segments persist a resume cursor; watermark promotion waits for the terminal page"
            echo "- Training eligibility: false"
          } >> "$GITHUB_STEP_SUMMARY"
