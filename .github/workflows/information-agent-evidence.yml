name: Information Agent Evidence

on:
  # Déclenché par la passe des réponses (`/api/cron/information-agent-inbound`) dès qu'une analyse attend, au plus
  # une fois par tranche de 10 min ; l'horaire GitHub, non tenu, reste le filet (docs/operations/planification.md).
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: immojudis-information-agent-evidence
  cancel-in-progress: false

jobs:
  process:
    # Receives the production service-role key: only the code of `main` may run with it (a dispatch from another
    # branch would run that branch's code with the secret).
    if: github.ref == 'refs/heads/main'
    name: Analyze private information-agent attachments
    runs-on: ubuntu-24.04
    # Secrets de production : lus dans l'environnement Production, restreint à main (audit du 16/11/2026).
    environment: Production
    timeout-minutes: 25
    env:
      # Secrets are given only to the steps that call Supabase or the AI provider,
      # never to the apt and pip steps.
      INFORMATION_AGENT_EVIDENCE_BATCH_SIZE: 5
      INFORMATION_AGENT_EVIDENCE_OCR_ENABLED: "true"
      INFORMATION_AGENT_EVIDENCE_SEMANTIC_ENABLED: "true"
      INFORMATION_AGENT_EVIDENCE_VISION_ENABLED: "true"
      LLM_ENABLED: "true"
      # Fournisseur de la lecture des réponses (Claude Haiku 5.5 depuis le 22/11/2026) ; retour arrière sans commit :
      # variable de dépôt LLM_PROVIDER=replicate, la même que celle du pipeline et de Vercel (pied des messages).
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      REPLICATE_MODEL: qwen/qwen3-7-plus
      REPLICATE_MIN_INTERVAL_SECONDS: 11
      REPLICATE_MAX_RETRIES: 0
      REPLICATE_MAX_CALLS_PER_HOUR: 60
      # Plafond horaire des appels de texte à Claude (src/config.py, ANTHROPIC_MAX_CALLS_PER_HOUR).
      ANTHROPIC_MAX_CALLS_PER_HOUR: "120"
    steps:
      # Le worker tourne quand une analyse attend, ou quand un fait attend le verdict de l'arbitre de la publication
      # automatique (étape 6 : RPC list_information_agent_facts_to_arbitrate, vide hors des modes simulation et
      # automatique ; même version du prompt que ARBITER_PROMPT_VERSION, test de concordance pytest).
      - name: Check for queued evidence
        id: preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          response="$(curl -fsS --get "${SUPABASE_URL%/}/rest/v1/information_agent_evidence_extractions" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            --data-urlencode "select=id" \
            --data-urlencode "status=in.(queued,failed,processing)" \
            --data-urlencode "attempts=lt.3" \
            --data-urlencode "limit=1")"
          # Faits à juger : une panne de cette lecture (RPC absente, erreur, réponse illisible) n'empêche jamais
          # l'analyse des pièces ; elle est signalée par un avertissement.
          if ! facts="$(curl -fsS -X POST "${SUPABASE_URL%/}/rest/v1/rpc/list_information_agent_facts_to_arbitrate" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data '{"p_prompt_version": "auto_publication_arbiter_v1", "p_limit": 1}')"; then
            echo "::warning title=Arbitre de la publication automatique::faits à juger illisibles ; seule l'analyse des pièces décide du lancement."
            facts='[]'
          fi
          facts_count="$(jq 'if type == "array" then length else 0 end' <<< "$facts" 2>/dev/null || echo 0)"
          if [ "$(jq 'length' <<< "$response")" -gt 0 ] || [ "${facts_count:-0}" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Production code only: never a revision chosen through a repository variable.
          ref: main

      - name: Record evidence worker revision
        if: steps.preflight.outputs.should_run == 'true'
        run: git rev-parse HEAD

      - name: Set up Python
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install OCR packages
        if: steps.preflight.outputs.should_run == 'true'
        # Nouvelles tentatives bornées, échec rapide et visible sur une panne durable (même script que
        # data-pipeline.yml).
        run: >
          bash services/data-pipeline/scripts/install_system_packages.sh
          tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Install Python dependencies
        if: steps.preflight.outputs.should_run == 'true'
        working-directory: services/data-pipeline
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Analyze queued attachments
        if: steps.preflight.outputs.should_run == 'true'
        working-directory: services/data-pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Jeton Replicate seulement pour le retour arrière (variable de dépôt LLM_PROVIDER=replicate).
          REPLICATE_API_TOKEN: ${{ vars.LLM_PROVIDER == 'replicate' && secrets.REPLICATE_API_TOKEN || '' }}
          # Le worker ouvre lui-même les pièces reçues (type, pages et images avec PyMuPDF) avec cette clé dans son
          # environnement. Seuls la lecture du texte des PDF, l'OCR (Tesseract) et la conversion HEIF tournent dans
          # des processus enfants à l'environnement en liste blanche, sans la clé (src/information_agent_evidence_child.py,
          # src/pdf_ocr.py).
          # Clé Anthropic seulement quand Claude lit (pas avec LLM_PROVIDER=replicate).
          ANTHROPIC_API_KEY: ${{ vars.LLM_PROVIDER != 'replicate' && secrets.ANTHROPIC_API_KEY || '' }}
        run: python -m src.information_agent_evidence
