name: Information Agent Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: immojudis-information-agent-evidence
  cancel-in-progress: false

jobs:
  process:
    name: Analyze private information-agent attachments
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      INFORMATION_AGENT_EVIDENCE_BATCH_SIZE: 5
    steps:
      - name: Check for queued evidence
        id: preflight
        run: |
          set -euo pipefail
          response="$(curl -fsS --get "${SUPABASE_URL%/}/rest/v1/information_agent_evidence_extractions" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" \
            --data-urlencode "select=id" \
            --data-urlencode "status=in.(queued,failed,processing)" \
            --data-urlencode "attempts=lt.3" \
            --data-urlencode "limit=1")"
          if [ "$(jq 'length' <<< "$response")" -gt 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt

      - name: Install OCR packages
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng

      - name: Install Python dependencies
        if: steps.preflight.outputs.should_run == 'true'
        working-directory: services/data-pipeline
        run: python -m pip install -r requirements.txt

      - name: Analyze queued attachments
        if: steps.preflight.outputs.should_run == 'true'
        working-directory: services/data-pipeline
        run: python -m src.information_agent_evidence
