name: Information Agent Evaluation Trial

# Essai réel et PAYANT du modèle de lecture des réponses sur le jeu d'évaluation fictif de la publication
# automatique (200 réponses, services/data-pipeline/tests/fixtures/information_agent_evaluation/). Lancement
# manuel seulement, depuis main, avec la phrase de confirmation. Plafond dur de 5 USD vérifié avant chaque
# appel par le script (services/data-pipeline/scripts/information_agent_evaluation_trial.py). Ne reçoit que le
# jeton du modèle : aucune clé Supabase, aucune écriture en base, aucun envoi d'email. Les sorties brutes sont
# publiées en artefact ; les rejouer dans le banc : voir docs/runbooks/information-agent.md.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Taper exactement : ESSAI PAYANT 5 USD"
        required: true
        type: string
      budget_usd:
        description: "Plafond de dépense estimée en USD (5 au plus ; le script refuse davantage)"
        required: false
        default: "5"
        type: string
      reprise_run_id:
        description: "Identifiant d'une exécution précédente de ce workflow à reprendre (vide : nouvel essai)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # Lecture de l'artefact d'une exécution précédente (reprise sans repayer les cas déjà faits).
  actions: read

concurrency:
  group: immojudis-information-agent-evaluation-trial
  cancel-in-progress: false

jobs:
  trial:
    # Le jeton du modèle n'est donné qu'au code de main.
    if: github.ref == 'refs/heads/main'
    name: Run the paid model trial on the fictitious evaluation set
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      PYTHONUNBUFFERED: "1"
      # Mêmes réglages du modèle que .github/workflows/information-agent-evidence.yml (test de concordance).
      LLM_ENABLED: "true"
      LLM_PROVIDER: replicate
      REPLICATE_MODEL: qwen/qwen3-7-plus
      REPLICATE_MIN_INTERVAL_SECONDS: 11
      REPLICATE_MAX_RETRIES: 0
      REPLICATE_MAX_CALLS_PER_HOUR: 60
    steps:
      - name: Check confirmation and inputs
        working-directory: .
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BUDGET_USD: ${{ inputs.budget_usd }}
          REPRISE_RUN_ID: ${{ inputs.reprise_run_id }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "ESSAI PAYANT 5 USD" ]; then
            echo "Confirmation absente ou inexacte : essai annulé." >&2
            exit 1
          fi
          if ! [[ "$BUDGET_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            echo "budget_usd illisible." >&2
            exit 1
          fi
          if [ -n "$REPRISE_RUN_ID" ] && ! [[ "$REPRISE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "reprise_run_id doit être un identifiant numérique." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Download the previous trial output (resume)
        if: inputs.reprise_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPRISE_RUN_ID: ${{ inputs.reprise_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RUNNER_TEMP/information-agent-evaluation/essai.json")"
          gh run download "$REPRISE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name information-agent-evaluation-trial --dir "$(dirname "$RUNNER_TEMP/information-agent-evaluation/essai.json")"
          test -f "$RUNNER_TEMP/information-agent-evaluation/essai.json"

      - name: Estimate the maximal cost (no call)
        env:
          BUDGET_USD: ${{ inputs.budget_usd }}
        run: python -m scripts.information_agent_evaluation_trial --output "$RUNNER_TEMP/information-agent-evaluation/essai.json" --budget-usd "$BUDGET_USD" --estimate-only

      - name: Run the trial
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        run: python -m scripts.information_agent_evaluation_trial --output "$RUNNER_TEMP/information-agent-evaluation/essai.json" --budget-usd "$BUDGET_USD"

      - name: Publish the raw model outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: information-agent-evaluation-trial
          path: ${{ runner.temp }}/information-agent-evaluation/essai.json
          if-no-files-found: warn
          retention-days: 30
