name: Recompute Existing Sales

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type production to use the production Supabase catalogue"
        required: true
        type: string
      source:
        description: "Existing source rows to recalibrate"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - avoventes
          - licitor
          - vench
          - info_encheres
          - encheres_publiques
          - petites_affiches
          - cessions_etat
          - agrasc
          - encheres_immobilieres
          - notaires
      limit:
        description: "Optional maximum number of stored rows"
        required: false
        type: string
      dry_run:
        description: "Recompute without publishing changes"
        required: false
        default: false
        type: boolean
      repair_only:
        description: "Skip recompute and only repair/verify persisted procedure payloads"
        required: false
        default: false
        type: boolean
      refresh_unknown_only:
        description: "Re-fetch source pages for unresolved procedures, then repair/verify"
        required: false
        default: false
        type: boolean
      readiness_only:
        description: "Evaluate only active sales still unassessed for the Premium catalogue"
        required: false
        default: false
        type: boolean
      drop_insufficient_only:
        description: "Report (dry_run) or delete stored sales without address or surface and without an agent e-mail"
        required: false
        default: false
        type: boolean
      max_deletions:
        description: "With drop_insufficient_only: refuse to delete anything above this many sales"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  # A manual recompute must never cancel (or be cancelled by) a pending
  # pipeline run, which a shared group would do. Both serialise on the
  # catalogue writer advisory lock taken by the Python entry points instead.
  group: immojudis-recompute
  cancel-in-progress: false

jobs:
  run:
    name: Recompute stored sales
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      # Honest, contactable crawler identity; a repository variable overrides it.
      AUCTION_USER_AGENT: ${{ vars.AUCTION_USER_AGENT || 'ImmojudisBot/1.0 (+https://immojudis.com/contact)' }}
      ENABLE_ENCHERES_PUBLIQUES_BENCHMARK: ${{ vars.ENCHERES_PUBLIQUES_BENCHMARK_ENABLED || 'false' }}
      ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED: ${{ vars.ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED || 'false' }}
      # No credential here: the pip and cache steps must not see any. Only the
      # recompute steps below receive SUPABASE_* secrets.
    steps:
      - name: Check target confirmation
        working-directory: ${{ github.workspace }}
        env:
          # Inputs reach the shell through the environment, never through
          # ${{ }} interpolation inside the script.
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          REPAIR_ONLY: ${{ inputs.repair_only }}
          REFRESH_UNKNOWN_ONLY: ${{ inputs.refresh_unknown_only }}
          READINESS_ONLY: ${{ inputs.readiness_only }}
          DROP_INSUFFICIENT_ONLY: ${{ inputs.drop_insufficient_only }}
          MAX_DELETIONS: ${{ inputs.max_deletions }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_TARGET" != "production" ]; then
            echo "confirm_target must be exactly: production" >&2
            exit 1
          fi
          selected_modes=0
          for mode in "$REPAIR_ONLY" "$REFRESH_UNKNOWN_ONLY" "$READINESS_ONLY" "$DROP_INSUFFICIENT_ONLY"; do
            if [ "$mode" = "true" ]; then
              selected_modes=$((selected_modes + 1))
            fi
          done
          if [ "$selected_modes" -gt 1 ]; then
            echo "repair_only, refresh_unknown_only, readiness_only and drop_insufficient_only are mutually exclusive" >&2
            exit 1
          fi
          if [ "$DROP_INSUFFICIENT_ONLY" = "true" ] && ! [[ "$MAX_DELETIONS" =~ ^[0-9]+$ ]]; then
            echo "max_deletions must be a whole number" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce Encheres Publiques refresh gate
        if: inputs.source == 'encheres_publiques' || (inputs.refresh_unknown_only && inputs.source == 'all')
        run: |
          set -euo pipefail
          if [ "$ENABLE_ENCHERES_PUBLIQUES_BENCHMARK" != "true" ] || [ "$ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED" != "true" ]; then
            echo "Encheres Publiques refresh refused until benchmark and access authorization are explicitly configured" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Compute cache day
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore verified Justice reference cache
        if: ${{ !inputs.readiness_only && !inputs.drop_insufficient_only }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/data-pipeline/data/raw/outcome_sources/justice_courts
          key: immojudis-justice-reference-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: |
            immojudis-justice-reference-${{ runner.os }}-

      - name: Refresh and verify official Justice references
        if: ${{ !inputs.readiness_only && !inputs.drop_insufficient_only }}
        run: python -m src.official_sources.justice_reference_sync

      - name: Validate recompute without writing
        if: ${{ !inputs.repair_only && !inputs.refresh_unknown_only && !inputs.readiness_only && !inputs.drop_insufficient_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--batch-size 20 --dry-run)
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          python -m src.recompute_scoring "${args[@]}"

      - name: Validate catalogue readiness without writing
        if: ${{ inputs.readiness_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--readiness-unassessed-only --batch-size 100 --dry-run)
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          python -m src.recompute_scoring "${args[@]}"

      - name: Publish recomputed sales
        if: ${{ !inputs.dry_run && !inputs.repair_only && !inputs.refresh_unknown_only && !inputs.readiness_only && !inputs.drop_insufficient_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Direct database session for the catalogue writer lock.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--batch-size 20 --geocode-missing --geocode-workers 4)
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          python -m src.recompute_scoring "${args[@]}"

      - name: Publish catalogue readiness
        if: ${{ !inputs.dry_run && inputs.readiness_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Direct database session for the catalogue writer lock.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--readiness-unassessed-only --batch-size 100)
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          python -m src.recompute_scoring "${args[@]}"

      - name: Refresh unresolved procedure source pages
        if: ${{ !inputs.dry_run && inputs.refresh_unknown_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Direct database session for the catalogue writer lock.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=(--refresh-unknown-procedures)
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          python -m src.recompute_scoring "${args[@]}"

      - name: Repair and verify persisted sale procedures
        if: ${{ !inputs.dry_run && !inputs.readiness_only && !inputs.drop_insufficient_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Direct database session for the catalogue writer lock.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          scope_args=()
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            scope_args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            scope_args+=(--limit "$REQUESTED_LIMIT")
          fi
          python -m src.recompute_scoring --repair-invalid-procedures "${scope_args[@]}"
          python -m src.recompute_scoring --verify-only "${scope_args[@]}"

      - name: Report or delete sales with insufficient information
        if: ${{ inputs.drop_insufficient_only }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Direct database session for the transactional deletion.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_SOURCE: ${{ inputs.source }}
          REQUESTED_LIMIT: ${{ inputs.limit }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          MAX_DELETIONS: ${{ inputs.max_deletions }}
        run: |
          set -euo pipefail
          args=(--drop-insufficient --drop-report insufficient-sales-report.json)
          if [ "$REQUESTED_SOURCE" != "all" ]; then
            args+=(--source "$REQUESTED_SOURCE")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          if [ "$REQUESTED_DRY_RUN" != "true" ]; then
            args+=(--execute-drop --max-deletions "$MAX_DELETIONS")
          fi
          python -m src.recompute_scoring "${args[@]}"

      - name: Keep the insufficient-information report
        if: ${{ always() && inputs.drop_insufficient_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: insufficient-sales-report
          path: services/data-pipeline/insufficient-sales-report.json
          if-no-files-found: ignore
          retention-days: 30
