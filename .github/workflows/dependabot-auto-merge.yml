name: Dependabot auto-merge (patch)

# Enables auto-merge on Dependabot pull requests that only bump patch versions (a single bump, or a
# grouped pull request whose every bump is a patch).
# GitHub merges them once every required check is green; minor and major bumps stay manual.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  patch-only:
    name: Enable auto-merge for patch updates
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge when every bump is a patch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          PR_BODY="${PR_BODY//$'\r'/}"
          # One bump: the title names it ("Bump x from 1.2.3 to 1.2.4"). Grouped PRs ("Bump the
          # python-dependencies group with 5 updates") name none: every bump is then a row of the
          # "| [package](url) | `from` | `to` |" table of the description. Either way every bump
          # must keep its major.minor, and every row must be readable.
          single="$(sed -nE 's/.* from v?([0-9]+\.[0-9]+)\.[0-9]+.* to v?([0-9]+\.[0-9]+)\.[0-9]+.*/\1 \2/p' <<<"$PR_TITLE")"
          if [ -n "$single" ]; then
            bumps=1
            patch_bumps="$(awk '$1 == $2' <<<"$single" | wc -l)"
          else
            bumps="$(grep -cE '^\| *\[' <<<"$PR_BODY" || true)"
            patch_bumps="$(sed -nE 's/^\| *\[[^|]*\| *`?v?([0-9]+\.[0-9]+)\.[0-9]+[^|`]*`? *\| *`?v?([0-9]+\.[0-9]+)\.[0-9]+[^|`]*`? *\| *$/\1 \2/p' <<<"$PR_BODY" | awk '$1 == $2' | wc -l)"
          fi
          if [ "$bumps" -gt 0 ] && [ "$bumps" -eq "$patch_bumps" ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Not only patch bumps (bumps=$bumps, patch=$patch_bumps): left for manual review."
          fi
