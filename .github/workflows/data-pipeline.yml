name: Immojudis Data Pipeline

on:
  workflow_dispatch:
    inputs:
      automatic:
        description: "Execute the SQL-scheduled bounded unit identified by run_id"
        required: false
        default: false
        type: boolean
      run_id:
        description: "auction_runs id created by the admin. Leave empty for an explicit manual scan."
        required: false
        type: string
      source:
        description: "Source to collect"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - avoventes
          - licitor
          - vench
          - info_encheres
          - encheres_publiques
          - petites_affiches
          - cessions_etat
          - agrasc
          - encheres_immobilieres
          - notaires
      limit:
        description: "Optional raw listing limit (document backlog: maximum sales, default 200; photo mirror backfill: maximum photos, default 3000)"
        required: false
        type: string
      publication_check:
        description: "Verify publication SQL with mandatory rollback"
        required: false
        default: false
        type: boolean
      enrichment_only:
        description: "Process pending document and extraction jobs only"
        required: false
        default: false
        type: boolean
      documents_backlog:
        description: "Read pending attachments (PDF) only: upcoming sales first, bounded by limit and budget"
        required: false
        default: false
        type: boolean
      documents_budget_minutes:
        description: "Document backlog time budget in minutes (default 120, maximum 150)"
        required: false
        type: string
      photo_mirror_backfill:
        description: "Copy the main photos of the catalogue (backfill of the stock): nearest sales first, bounded by limit and budget. Needs the repository variable PHOTO_MIRROR_ENABLED=true"
        required: false
        default: false
        type: boolean
      photo_mirror_budget_minutes:
        description: "Photo mirror backfill time budget in minutes (default 60, maximum 150)"
        required: false
        type: string
      llm_backfill:
        description: "Backfill missing AI display descriptions from existing Supabase rows"
        required: false
        default: false
        type: boolean
      model_benchmark:
        description: "Compare Replicate models on fixed synthetic cases without touching Supabase"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Catalogue preservation and cleanup are deliberately single-writer. The
  # document backlog has its own group so that scheduled collections are not
  # queued (and superseded) behind a long drain; both serialise their writes on
  # the catalogue writer lock, which the drain takes and releases per sale.
  # The photo mirror backfill never writes the catalogue (only sale_photos and the sale-photos bucket)
  # and holds its own database lock against a scheduled pass, so it does not queue behind collections.
  group: ${{ inputs.model_benchmark && 'immojudis-llm-benchmark' || (inputs.publication_check && 'immojudis-publication-verification' || (inputs.documents_backlog && 'immojudis-document-backlog' || (inputs.photo_mirror_backfill && 'immojudis-photo-mirror' || 'immojudis-data-pipeline'))) }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' && !inputs.model_benchmark
    name: Run data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      PYTHONUNBUFFERED: "1"
      PIPELINE_TRACEBACK_SECONDS: "300"
      # Honest, contactable crawler identity; a repository variable overrides it.
      AUCTION_USER_AGENT: ${{ vars.AUCTION_USER_AGENT || 'ImmojudisBot/1.0 (+https://immojudis.com/contact)' }}
      # Secrets are not part of the job environment: the pip and apt steps
      # must not see them. Only the Python business steps below receive them.
      SOURCE_FETCH_RELAY_URL: ${{ vars.SOURCE_FETCH_RELAY_URL }}
      # Merging duplicates already in the database stays off until the repository variable
      # DEDUPE_RECONCILE_ENABLED is set to true (docs/runbooks/chantier-f-reparations-donnees.md).
      DEDUPE_RECONCILE_ENABLED: ${{ vars.DEDUPE_RECONCILE_ENABLED || 'false' }}
      # Repository variable DEDUPE_RECONCILE_MODE=candidates: the sweep only lists the pairs it would merge.
      DEDUPE_RECONCILE_MODE: ${{ vars.DEDUPE_RECONCILE_MODE || 'apply' }}
      REPLICATE_MODEL: qwen/qwen3-7-plus
      PIPELINE_ENRICH_WORKERS: 2
      PIPELINE_LLM_WORKERS: 1
      PIPELINE_PDF_MAX_TARGETS: 10
      # Remaining descriptions are persisted in the enrichment queue.
      PIPELINE_LLM_MAX_TARGETS: 10
      PIPELINE_LLM_BACKFILL_MAX_TARGETS: 5
      PIPELINE_LLM_BACKFILL_PROGRESS_EVERY: 5
      # Replicate currently permits 6 prediction starts/minute with burst 1
      # while the account credit is below $5. Leave a margin above 10 seconds.
      REPLICATE_MIN_INTERVAL_SECONDS: 11
      # Let Replicate keep the POST open for the normal generation window. It
      # reduces follow-up polling in the logs; it does not change provider
      # runtime billing or cancel a prediction.
      REPLICATE_WAIT_SECONDS: 60
      REPLICATE_MAX_RETRIES: 2
      REPLICATE_MAX_CALLS_PER_HOUR: 60
      REPLICATE_RETRY_BACKOFF_SECONDS: 30
      REPLICATE_RETRY_MAX_SLEEP_SECONDS: 60
      # Claim two source-detail jobs per RPC, then process them sequentially.
      # Raise to 3 only after three comparable runs show
      # source_detail_max_batch_seconds < 900, zero expired claims, and no
      # provider Retry-After deferrals. The queue lease is 1,800 seconds.
      PIPELINE_ENRICHMENT_SOURCE_DETAIL_CLAIM_BATCH_SIZE: 2
      REPLICATE_TEMPERATURE: 0.1
      REPLICATE_MAX_TOKENS: 512
      # Structured evidence needs room for valid JSON; summaries remain short.
      REPLICATE_FACT_MAX_TOKENS: 4096
      # Ordinary scans make one final display pass. The queue explicitly uses
      # structured_then_display when a fact extraction is planned.
      LLM_EXTRACTION_MODE: display_description
      LLM_PROMPT_VERSION: auction_llm_v10_structured_display
      LLM_FACT_PROMPT_VERSION: auction_facts_v1
      LLM_DISPLAY_PROMPT_VERSION: auction_display_v10_canonical_facts
      LLM_FACT_CHUNK_CHARS: 10000
      LLM_FACT_MAX_CHUNKS: 3
      LLM_DISPLAY_CONTEXT_CHARS: 8000
      LLM_PDF_MAX_CHARS: 8000
      PIPELINE_ENRICHMENT_QUEUE_BATCH_SIZE: 4
      LLM_ENABLED: true
      LLM_PROVIDER: replicate
      INFORMATION_AGENT_EVIDENCE_OCR_ENABLED: "true"
      INFORMATION_AGENT_EVIDENCE_SEMANTIC_ENABLED: "true"
      INFORMATION_AGENT_EVIDENCE_VISION_ENABLED: "true"
      PDF_EXTRACTOR: auto
      PDF_DOCLING_ENABLED: false
      PDF_OCR_ENABLED: true
      PDF_MAX_DOCUMENTS_PER_SALE: 6
      PDF_MAX_DOWNLOAD_MB: 50
      # Vench publishes a 416-page, 9.6 MB descriptive report. OCR remains
      # limited per pass and document downloads stay capped at 50 MB.
      PDF_MAX_TOTAL_PAGES: 500
      # At most one attachment request every two seconds per host (robots.txt
      # Crawl-delay raises it).
      PDF_HOST_MIN_DELAY_SECONDS: 2
      ENABLE_LICITOR_BENCHMARK: true
      # Interrupteur de suspension du decodage des adresses masquees (actif si la variable de depot est absente).
      LICITOR_DECODE_PROTECTED_EMAILS: ${{ vars.LICITOR_DECODE_PROTECTED_EMAILS || 'true' }}
      ENABLE_VENCH_BENCHMARK: true
      ENABLE_INFO_ENCHERES_BENCHMARK: true
      # A repository variable is required for each half of the future source
      # activation. Undefined variables resolve to the disabled default.
      ENABLE_ENCHERES_PUBLIQUES_BENCHMARK: ${{ vars.ENCHERES_PUBLIQUES_BENCHMARK_ENABLED || 'false' }}
      ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED: ${{ vars.ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED || 'false' }}
      ENABLE_PETITES_AFFICHES_BENCHMARK: true
      ENABLE_CESSIONS_ETAT_BENCHMARK: true
      ENABLE_AGRASC_BENCHMARK: true
      ENABLE_ENCHERES_IMMOBILIERES_BENCHMARK: true
      ENABLE_NOTAIRES_BENCHMARK: true
      NOTAIRES_MAX_PAGES: 100
      INFO_ENCHERES_MAX_PAGES: 100
      CESSIONS_ETAT_MAX_PAGES: 100
      ENCHERES_IMMOBILIERES_MAX_PAGES: 100
      LICITOR_MAX_PAGES: 100
      PIPELINE_IDLE_LLM_BACKFILL_ENABLED: false
      # Copie hébergée de la photo principale (docs/runbooks/retrait-photos.md). Désactivée tant que la
      # variable de dépôt PHOTO_MIRROR_ENABLED n'est pas « true » : rien n'est téléchargé ni écrit.
      PHOTO_MIRROR_ENABLED: ${{ vars.PHOTO_MIRROR_ENABLED || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce Encheres Publiques access gate
        if: inputs.source == 'encheres_publiques' || (inputs.source == 'all' && vars.ENCHERES_PUBLIQUES_BENCHMARK_ENABLED == 'true')
        env:
          EP_BENCHMARK_ENABLED: ${{ vars.ENCHERES_PUBLIQUES_BENCHMARK_ENABLED || 'false' }}
          EP_ACCESS_AUTHORIZED: ${{ vars.ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED || 'false' }}
        run: |
          set -euo pipefail
          if [ "$EP_BENCHMARK_ENABLED" != "true" ] || [ "$EP_ACCESS_AUTHORIZED" != "true" ]; then
            echo "Encheres Publiques is disabled: benchmark and access authorization must both be explicitly configured" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Compute cache day
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pipeline extraction cache
        id: extraction-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/data-pipeline/data/documents
            services/data-pipeline/data/raw/pdf_texts
            services/data-pipeline/data/raw/docling_texts
            services/data-pipeline/data/processed/llm_extractions
          # Every run saves its own entry (day + run id, see "Save extraction
          # checkpoints"), so no run's work is lost behind the first run of the
          # day. The key below never matches exactly: the most recent entry of
          # the day, then the most recent earlier one, is restored by prefix.
          key: immojudis-data-pipeline-${{ runner.os }}-${{ steps.date.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            immojudis-data-pipeline-${{ runner.os }}-${{ steps.date.outputs.day }}-
            immojudis-data-pipeline-${{ runner.os }}-

      # Names and sizes of what was restored: the new entry is saved at the end
      # only if the run changed them (see the save step at the end of the job).
      - name: Fingerprint restored extraction cache
        id: cache-before
        run: >
          echo "digest=$(python scripts/cache_fingerprint.py
          data/documents data/raw/pdf_texts data/raw/docling_texts data/processed/llm_extractions)"
          >> "$GITHUB_OUTPUT"

      # Parcels already resolved through API Carto (cessions de l'État): a separate
      # entry so the extraction cache above keeps its own path set.
      - name: Restore cadastral reference cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/data-pipeline/data/processed/cadastre_references
          key: immojudis-cadastre-references-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: |
            immojudis-cadastre-references-${{ runner.os }}-

      - name: Restore verified Justice reference cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: services/data-pipeline/data/raw/outcome_sources/justice_courts
          key: immojudis-justice-reference-${{ runner.os }}-${{ steps.date.outputs.day }}
          restore-keys: |
            immojudis-justice-reference-${{ runner.os }}-

      - name: Install document extraction packages
        run: |
          packages=(antiword)
          if [ "${PDF_OCR_ENABLED:-false}" = "true" ]; then
            packages+=(tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng)
          fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      # The references change rarely: a verified copy younger than 7 days (restored
      # from the cache above) is kept without any network access. A failed refresh
      # keeps the valid copy; the step fails, with an explicit message, only when no
      # valid copy exists at all.
      - name: Refresh and verify official Justice references
        run: python -m src.official_sources.justice_reference_sync --max-age-days 7

      - name: Run manually requested pipeline
        id: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE_FETCH_RELAY_TOKEN: ${{ secrets.SOURCE_FETCH_RELAY_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REQUESTED_AUTOMATIC: ${{ inputs.automatic }}
          REQUESTED_PUBLICATION_CHECK: ${{ github.event.inputs.publication_check }}
          REQUESTED_ENRICHMENT_ONLY: ${{ github.event.inputs.enrichment_only }}
          REQUESTED_DOCUMENTS_BACKLOG: ${{ github.event.inputs.documents_backlog }}
          REQUESTED_DOCUMENTS_BUDGET_MINUTES: ${{ github.event.inputs.documents_budget_minutes }}
          REQUESTED_PHOTO_MIRROR_BACKFILL: ${{ github.event.inputs.photo_mirror_backfill }}
          REQUESTED_PHOTO_MIRROR_BUDGET_MINUTES: ${{ github.event.inputs.photo_mirror_budget_minutes }}
          REQUESTED_RUN_ID: ${{ github.event.inputs.run_id }}
          REQUESTED_SOURCE: ${{ github.event.inputs.source }}
          REQUESTED_LIMIT: ${{ github.event.inputs.limit }}
          REQUESTED_LLM_BACKFILL: ${{ github.event.inputs.llm_backfill }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?Transactional publication requires SUPABASE_DB_URL}"

          # Exit code 2 means "published, but an enabled source was empty or
          # failed": a warning that must not stop the steps that follow.
          if [ "$REQUESTED_AUTOMATIC" = "true" ]; then
            bash scripts/allow_source_warning.sh python -m src.autonomous_runner --run-id "$REQUESTED_RUN_ID"
            exit 0
          fi

          if [ "$REQUESTED_PUBLICATION_CHECK" = "true" ]; then
            python -m src.verify_publication
            exit 0
          fi
          if [ "$REQUESTED_DOCUMENTS_BACKLOG" = "true" ]; then
            # Values are validated and clamped by the Python entry point.
            python -m src.document_backlog \
              --max-sales "${REQUESTED_LIMIT:-200}" \
              --budget-minutes "${REQUESTED_DOCUMENTS_BUDGET_MINUTES:-120}"
            exit 0
          fi
          if [ "$REQUESTED_PHOTO_MIRROR_BACKFILL" = "true" ]; then
            # Values are validated and clamped by the Python entry point; nothing happens
            # unless PHOTO_MIRROR_ENABLED is true.
            python -m src.photo_mirror \
              --max-photos "${REQUESTED_LIMIT:-3000}" \
              --budget-minutes "${REQUESTED_PHOTO_MIRROR_BUDGET_MINUTES:-60}"
            exit 0
          fi
          if [ "$REQUESTED_ENRICHMENT_ONLY" = "true" ]; then
            bash scripts/allow_source_warning.sh python -m src.queued_runner --enrichment-only
            exit 0
          fi

          args=(--source "${REQUESTED_SOURCE:-all}")
          if [ "${REQUESTED_LLM_BACKFILL:-false}" = "true" ]; then
            python -m src.revalidate_displays --limit 1000
            args+=(--backfill-llm-descriptions)
          fi
          if [ -n "$REQUESTED_RUN_ID" ]; then
            args+=(--run-id "$REQUESTED_RUN_ID")
          fi
          if [ -n "$REQUESTED_LIMIT" ]; then
            args+=(--limit "$REQUESTED_LIMIT")
          fi
          bash scripts/allow_source_warning.sh python -m src.main "${args[@]}"

      - name: Finalize unfinished run
        if: always() && inputs.publication_check != true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REQUESTED_AUTOMATIC: ${{ inputs.automatic }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: python -m src.run_finalizer

      - name: Report source coverage and enrichment backlog
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m src.pipeline_health --report-only

      # Copie des photos principales après la collecte planifiée : étape séparée et bornée (15 min,
      # 400 photos par défaut), qui ne fait jamais échouer la collecte (continue-on-error) et ne tourne
      # que si la variable de dépôt PHOTO_MIRROR_ENABLED vaut « true ».
      - name: Copie des photos principales
        if: inputs.automatic == true && vars.PHOTO_MIRROR_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 25
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PHOTO_MIRROR_BUDGET_MINUTES: ${{ vars.PHOTO_MIRROR_BUDGET_MINUTES || '15' }}
          PHOTO_MIRROR_MAX_PHOTOS: ${{ vars.PHOTO_MIRROR_MAX_PHOTOS || '400' }}
        run: python -m src.photo_mirror

      - name: Flag partial collection
        if: always() && steps.pipeline.outputs.source_warning == 'true'
        run: |
          {
            echo "### Collecte partielle"
            echo "Au moins une source activée a rendu 0 annonce ou a levé une erreur. Voir les annotations « Source … en échec » de cette exécution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bound extraction cache
        if: always() && steps.pipeline.outcome != 'skipped' && inputs.publication_check != true && steps.extraction-cache.outputs.cache-hit != 'true'
        run: >
          python scripts/prune_cache_dirs.py --max-age-days 14 --max-total-mb 300
          data/documents data/raw/pdf_texts data/raw/docling_texts data/processed/llm_extractions

      - name: Fingerprint extraction cache after the run
        id: cache-after
        if: always() && steps.pipeline.outcome != 'skipped' && inputs.publication_check != true && steps.extraction-cache.outputs.cache-hit != 'true'
        run: >
          echo "digest=$(python scripts/cache_fingerprint.py
          data/documents data/raw/pdf_texts data/raw/docling_texts data/processed/llm_extractions)"
          >> "$GITHUB_OUTPUT"

      - name: Save extraction checkpoints
        # A cache entry cannot be overwritten, so each run writes a new one named
        # after the day and the run id (a re-run of the same run id finds its entry
        # already there and skips the save). The entry is written only when the
        # run changed the files (names or sizes) compared with what it restored,
        # which keeps the repository cache (10 GB) from churning and evicting the
        # Justice and cadastre reference caches.
        if: always() && steps.pipeline.outcome != 'skipped' && inputs.publication_check != true && steps.extraction-cache.outputs.cache-hit != 'true' && steps.cache-after.outputs.digest != steps.cache-before.outputs.digest
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            services/data-pipeline/data/documents
            services/data-pipeline/data/raw/pdf_texts
            services/data-pipeline/data/raw/docling_texts
            services/data-pipeline/data/processed/llm_extractions
          key: immojudis-data-pipeline-${{ runner.os }}-${{ steps.date.outputs.day }}-${{ github.run_id }}

  model-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.model_benchmark
    name: Compare Replicate models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/data-pipeline
    env:
      LLM_PROVIDER: replicate
      LLM_ENABLED: true
      APP_ENV: benchmark
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.lock

      - name: Install pipeline dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Compare existing and candidate models
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: python -m scripts.benchmark_replicate_models --output model-benchmark.json

      - name: Save model comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replicate-model-benchmark
          path: services/data-pipeline/model-benchmark.json
          if-no-files-found: warn
