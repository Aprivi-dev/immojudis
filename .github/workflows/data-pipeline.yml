name: Supabase read-only diagnostic (candidate)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Read-only PostgreSQL diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The secret is available only to the process and is never printed.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out immutable worker ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install only the PostgreSQL client
        run: python -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.3'

      - name: Run read-only diagnostic
        run: python scripts/supabase-readonly-diagnostic.py
