name: Read-only source browser probe
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source to probe once without publication"
        default: encheres_immobilieres
        type: choice
        options:
          - encheres_immobilieres
          - encheres_publiques
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_ENCHERES_PUBLIQUES_BENCHMARK: ${{ vars.ENCHERES_PUBLIQUES_BENCHMARK_ENABLED || 'false' }}
      ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED: ${{ vars.ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce Encheres Publiques access gate
        if: inputs.source == 'encheres_publiques'
        run: |
          set -euo pipefail
          if [ "$ENABLE_ENCHERES_PUBLIQUES_BENCHMARK" != "true" ] || [ "$ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED" != "true" ]; then
            echo "Encheres Publiques probe refused until benchmark and access authorization are explicitly configured" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/probe-source-browser.mjs
        env:
          PROBE_SOURCE: ${{ inputs.source }}
          ENABLE_ENCHERES_PUBLIQUES_BENCHMARK: ${{ vars.ENCHERES_PUBLIQUES_BENCHMARK_ENABLED || 'false' }}
          ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED: ${{ vars.ENCHERES_PUBLIQUES_ACCESS_AUTHORIZED || 'false' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-browser-probe
          path: data/audits/browser-probe.json
