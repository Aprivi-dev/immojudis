version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades require an explicit migration plan. Let Dependabot keep
    # delivering security updates plus routine minor and patch maintenance
    # without creating predictably broken Vercel previews.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # These minor releases deliberately change generated formatting or the
      # pinned Stripe API version. Upgrade them in dedicated migration PRs.
      - dependency-name: prettier
      - dependency-name: stripe
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directory: /services/data-pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependabot edits requirements*.txt but cannot regenerate the hashed
    # requirements*.lock (scripts/compile_locks.sh), so every pip PR needs a
    # manual lock refresh: one grouped PR per week keeps that to one push.
    # Major upgrades (for example pandas 3) need a dedicated migration PR.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
